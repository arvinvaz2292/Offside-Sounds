<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Offside Sound App</title>

  <!-- WaveSurfer -->
  <script src="https://unpkg.com/wavesurfer.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    }

    body{
      background:#000;
      color:white;
      padding:20px;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
      flex-wrap:wrap;
      gap:15px;
    }

    h1{
      font-size:42px;
    }

    .subtitle{
      color:#888;
      margin-top:5px;
    }

    .top-buttons{
      display:flex;
      gap:10px;
    }

    button{
      border:none;
      cursor:pointer;
      transition:0.2s;
    }

    .add-btn{
      background:white;
      color:black;
      padding:14px 20px;
      border-radius:18px;
      font-size:16px;
      font-weight:bold;
    }

    .stop-all-btn{
      background:#d11a2a;
      color:white;
      padding:14px 20px;
      border-radius:18px;
      font-size:16px;
      font-weight:bold;
    }

    .tracks{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
      gap:20px;
    }

    .track{
      background:#121212;
      border:1px solid #222;
      border-radius:28px;
      padding:20px;
      transition:0.25s;
    }

    .track.playing-track{
      border:2px solid #32d46d;
      box-shadow:0 0 25px rgba(50,212,109,0.4);
      transform:scale(1.01);
    }

    .track-title{
      font-size:28px;
      margin-bottom:15px;
      word-break:break-word;
    }

    .controls{
      display:flex;
      gap:10px;
      margin-bottom:20px;
    }

    .play-btn{
      flex:1;
      background:#333;
      color:white;
      padding:22px;
      border-radius:22px;
      font-size:24px;
      font-weight:bold;
    }

    .play-btn.playing{
      background:#32d46d;
      color:black;
    }

    .stop-btn{
      background:#a31420;
      color:white;
      padding:0 24px;
      border-radius:22px;
      font-size:18px;
      font-weight:bold;
    }

    .section{
      margin-top:18px;
    }

    label{
      display:block;
      margin-bottom:8px;
      color:#aaa;
      font-size:14px;
    }

    input[type="file"]{
      width:100%;
      color:white;
    }

    input[type="range"]{
      width:100%;
      margin-top:8px;
    }

    .loop-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:#1e1e1e;
      padding:14px 16px;
      border-radius:18px;
      margin-top:20px;
    }

    .loop-btn{
      padding:10px 18px;
      border-radius:14px;
      background:#333;
      color:white;
      font-weight:bold;
    }

    .loop-btn.active{
      background:#32d46d;
      color:black;
    }

    .fade-buttons{
      display:flex;
      gap:10px;
      margin-top:10px;
    }

    .fade-btn{
      flex:1;
      padding:12px;
      border-radius:14px;
      background:#222;
      color:white;
      font-weight:bold;
    }

    .wave-container{
      background:#1a1a1a;
      border-radius:16px;
      overflow:hidden;
      margin-top:10px;
    }

    .footer{
      margin-top:40px;
      background:#111;
      border:1px solid #222;
      border-radius:28px;
      padding:24px;
    }

    .footer h2{
      margin-bottom:12px;
    }

    .footer ol{
      padding-left:20px;
      color:#bbb;
      line-height:1.8;
    }

    .loop-region{
      display:flex;
      gap:10px;
      align-items:center;
      margin-top:10px;
    }

    .loop-region input{
      width:80px;
      padding:10px;
      border-radius:10px;
      border:none;
      background:#222;
      color:white;
    }

    @media(max-width:700px){
      h1{
        font-size:32px;
      }

      .play-btn{
        font-size:20px;
        padding:20px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div>
      <h1>Offside Sound App</h1>
      <div class="subtitle">by Arvin Vaz</div>
    </div>

    <div class="top-buttons">
      <button class="add-btn" onclick="addTrack()">
        + Add Track
      </button>

      <button class="stop-all-btn" onclick="stopAll()">
        STOP ALL
      </button>
    </div>
  </div>

  <div class="tracks" id="tracks"></div>

  <div class="footer">
    <h2>How to Use</h2>

    <ol>
      <li>Upload audio files.</li>
      <li>Play multiple tracks simultaneously.</li>
      <li>Use waveform to scrub audio.</li>
      <li>Set custom loop regions.</li>
      <li>Fade tracks in and out live.</li>
      <li>Perfect for theatre playback on iPad.</li>
    </ol>
  </div>

  <script>

    let tracks = [];

    function createTrack(name='New Track'){

      const audio = new Audio();

      audio.preload = "auto";
      audio.loop = false;

      const track = {
        id: Date.now() + Math.random(),
        name,
        audio,
        playing:false,
        loopEnabled:false,
        loopStart:0,
        loopEnd:null,
        fadeInterval:null,
        waveSurfer:null
      };

      tracks.push(track);

      renderTracks();
    }

    function renderTracks(){

      const container = document.getElementById('tracks');

      container.innerHTML = '';

      tracks.forEach(track => {

        const div = document.createElement('div');

        div.className = track.playing
          ? 'track playing-track'
          : 'track';

        div.innerHTML = `

          <div class="track-title">
            ${track.name}
          </div>

          <div class="controls">

            <button
              class="play-btn ${track.playing ? 'playing' : ''}"
              onclick="togglePlay('${track.id}')"
            >
              ${track.playing ? 'PAUSE' : 'PLAY'}
            </button>

            <button
              class="stop-btn"
              onclick="stopTrack('${track.id}')"
            >
              STOP
            </button>

          </div>

          <div class="section">

            <label>Upload Audio</label>

            <input
              type="file"
              accept=".mp3,.wav,.m4a,.aac,audio/*"
              onchange="uploadFile(event,'${track.id}')"
            >

          </div>

          <div class="section">

            <label>Waveform</label>

            <div
              id="waveform-${track.id}"
              class="wave-container"
            ></div>

          </div>

          <div class="section">

            <label>Seek Track</label>

            <input
              type="range"
              min="0"
              max="100"
              value="0"
              oninput="seekTrack('${track.id}', this.value)"
            >

          </div>

          <div class="section">

            <label>Volume</label>

            <input
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="1"
              oninput="changeVolume('${track.id}', this.value)"
            >

          </div>

          <div class="section">

            <label>Fade Controls</label>

            <div class="fade-buttons">

              <button
                class="fade-btn"
                onclick="fadeVolume('${track.id}',1)"
              >
                Fade In
              </button>

              <button
                class="fade-btn"
                onclick="fadeVolume('${track.id}',0)"
              >
                Fade Out
              </button>

            </div>

          </div>

          <div class="section">

            <label>Loop Region (%)</label>

            <div class="loop-region">

              <input
                id="loop-start-${track.id}"
                type="number"
                min="0"
                max="100"
                value="0"
              >

              <span>to</span>

              <input
                id="loop-end-${track.id}"
                type="number"
                min="0"
                max="100"
                value="100"
              >

              <button
                class="loop-btn"
                onclick="setLoopRegion('${track.id}')"
              >
                Set
              </button>

            </div>

          </div>

          <div class="loop-row">

            <span>Enable Loop</span>

            <button
              class="loop-btn ${track.loopEnabled ? 'active' : ''}"
              onclick="toggleLoop('${track.id}')"
            >
              ${track.loopEnabled ? 'ON' : 'OFF'}
            </button>

          </div>

        `;

        container.appendChild(div);

        setTimeout(() => {

          if(track.waveSurfer){
            track.waveSurfer.destroy();
          }

          track.waveSurfer = WaveSurfer.create({

            container:`#waveform-${track.id}`,
            waveColor:'#666',
            progressColor:'#32d46d',
            cursorColor:'#fff',
            height:80,
            responsive:true,
            barWidth:2,
            normalize:true

          });

          if(track.audio.src){
            track.waveSurfer.load(track.audio.src);
          }

        },100);

      });

    }

    function uploadFile(event,id){

      const file = event.target.files[0];

      if(!file) return;

      const track = tracks.find(t => t.id == id);

      const fileURL = URL.createObjectURL(file);

      track.audio.src = fileURL;

      track.audio.load();

      track.name = file.name.replace(/\.[^/.]+$/, '');

      renderTracks();
    }

    async function togglePlay(id){

      const track = tracks.find(t => t.id == id);

      if(!track.audio.src){
        alert('Upload audio first.');
        return;
      }

      if(track.playing){

        track.audio.pause();
        track.playing = false;

      } else {

        await track.audio.play();
        track.playing = true;

      }

      renderTracks();
    }

    function stopTrack(id){

      const track = tracks.find(t => t.id == id);

      track.audio.pause();

      track.audio.currentTime = 0;

      track.playing = false;

      renderTracks();
    }

    function stopAll(){

      tracks.forEach(track => {

        track.audio.pause();

        track.audio.currentTime = 0;

        track.playing = false;

      });

      renderTracks();
    }

    function changeVolume(id,volume){

      const track = tracks.find(t => t.id == id);

      track.audio.volume = volume;
    }

    function seekTrack(id,value){

      const track = tracks.find(t => t.id == id);

      if(!track.audio.duration) return;

      const time =
        (value / 100) * track.audio.duration;

      track.audio.currentTime = time;

      if(track.waveSurfer){
        track.waveSurfer.seekTo(value / 100);
      }
    }

    function fadeVolume(id,target){

      const track = tracks.find(t => t.id == id);

      clearInterval(track.fadeInterval);

      track.fadeInterval = setInterval(() => {

        let current = track.audio.volume;

        if(target === 0){

          current -= 0.02;

          if(current <= 0){
            current = 0;
            clearInterval(track.fadeInterval);
          }

        } else {

          current += 0.02;

          if(current >= 1){
            current = 1;
            clearInterval(track.fadeInterval);
          }

        }

        track.audio.volume = current;

      },50);
    }

    function setLoopRegion(id){

      const track = tracks.find(t => t.id == id);

      if(!track.audio.duration){
        alert('Load audio first.');
        return;
      }

      const start =
        parseFloat(
          document.getElementById(`loop-start-${id}`).value
        );

      const end =
        parseFloat(
          document.getElementById(`loop-end-${id}`).value
        );

      track.loopStart =
        (start / 100) * track.audio.duration;

      track.loopEnd =
        (end / 100) * track.audio.duration;

      alert('Loop region set.');
    }

    function toggleLoop(id){

      const track = tracks.find(t => t.id == id);

      track.loopEnabled = !track.loopEnabled;

      renderTracks();
    }

    setInterval(() => {

      tracks.forEach(track => {

        if(
          track.playing &&
          track.loopEnabled &&
          track.loopEnd !== null &&
          track.audio.currentTime >= track.loopEnd
        ){
          track.audio.currentTime = track.loopStart;
        }

      });

    },100);

    function addTrack(){
      createTrack();
    }

    createTrack('Rain Ambience');
    createTrack('Tension Drone');
    createTrack('Church Bell');

  </script>

</body>
</html>

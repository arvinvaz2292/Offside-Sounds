Offside Sound App — Working HTML
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offside Sound App</title>

<script src="https://unpkg.com/wavesurfer.js@7"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  background: #050505;
  color: white;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
  flex-wrap: wrap;
  gap: 15px;
}

h1 {
  font-size: 40px;
}

.subtitle {
  color: #777;
  margin-top: 5px;
}

.top-buttons {
  display: flex;
  gap: 10px;
}

button {
  border: none;
  cursor: pointer;
}

.add-btn,
.stop-all-btn {
  padding: 14px 20px;
  border-radius: 18px;
  font-size: 16px;
  font-weight: bold;
}

.add-btn {
  background: white;
  color: black;
}

.stop-all-btn {
  background: #b31320;
  color: white;
}

.tracks {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.track {
  background: #121212;
  border: 1px solid #222;
  border-radius: 24px;
  padding: 20px;
  transition: 0.2s;
}

.track.playing {
  border: 2px solid #32d46d;
  box-shadow: 0 0 20px rgba(50,212,109,0.3);
}

.track-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  gap: 15px;
}

.track-title {
  font-size: 26px;
  font-weight: bold;
}

.scene-label {
  color: #32d46d;
  margin-top: 4px;
  font-size: 14px;
}

.controls {
  display: flex;
  gap: 10px;
}

.play-btn,
.stop-btn {
  border-radius: 18px;
  font-weight: bold;
}

.play-btn {
  background: #333;
  color: white;
  padding: 18px 32px;
  font-size: 20px;
}

.play-btn.playing {
  background: #32d46d;
  color: black;
}

.stop-btn {
  background: #8d111b;
  color: white;
  padding: 18px 24px;
}

.section {
  margin-top: 18px;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #888;
  font-size: 14px;
}

input[type="file"],
input[type="text"],
textarea {
  width: 100%;
}

input[type="text"],
textarea {
  background: #1d1d1d;
  border: none;
  border-radius: 12px;
  padding: 12px;
  color: white;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

input[type="range"] {
  width: 100%;
}

.wave {
  background: #191919;
  border-radius: 14px;
  overflow: hidden;
}

.loop-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.loop-row button {
  background: #2a2a2a;
  color: white;
  padding: 10px 14px;
  border-radius: 12px;
}

.footer {
  margin-top: 40px;
  background: #111;
  border: 1px solid #222;
  border-radius: 24px;
  padding: 24px;
}

.footer ol {
  padding-left: 20px;
  color: #aaa;
  line-height: 1.8;
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Offside Sound App</h1>
    <div class="subtitle">by Arvin Vaz</div>
  </div>

  <div class="top-buttons">
    <button class="add-btn" onclick="addTrack()">+ Add Track</button>
    <button class="stop-all-btn" onclick="stopAll()">STOP ALL</button>
  </div>
</div>

<div id="tracks" class="tracks"></div>

<div class="footer">
  <ol>
    <li>Upload audio files.</li>
    <li>Press PLAY to fade in tracks.</li>
    <li>STOP fades out tracks.</li>
    <li>Playing tracks move to the top.</li>
    <li>Set loop points using buttons.</li>
    <li>Add scene labels and notes.</li>
  </ol>
</div>

<script>
let tracks = [];

function addTrack(name = 'New Track') {

  const audio = new Audio();

  const track = {
    id: Date.now() + Math.random(),
    name,
    audio,
    playing: false,
    volume: 1,
    loopEnabled: false,
    loopStart: 0,
    loopEnd: null,
    wavesurfer: null,
    scene: '',
    notes: ''
  };

  tracks.push(track);

  renderTracks();
}

function renderTracks() {

  tracks.sort((a,b) => b.playing - a.playing);

  const container = document.getElementById('tracks');
  container.innerHTML = '';

  tracks.forEach(track => {

    const div = document.createElement('div');

    div.className = track.playing
      ? 'track playing'
      : 'track';

    div.innerHTML = `

      <div class="track-header">

        <div>
          <div class="track-title">${track.name}</div>
          <div class="scene-label">${track.scene || 'No Scene Assigned'}</div>
        </div>

        <div class="controls">

          <button
            class="play-btn ${track.playing ? 'playing' : ''}"
            onclick="togglePlay('${track.id}')"
          >
            ${track.playing ? 'PLAYING' : 'PLAY'}
          </button>

          <button
            class="stop-btn"
            onclick="stopTrack('${track.id}')"
          >
            STOP
          </button>

        </div>

      </div>

      <div class="section">
        <label>Upload Audio</label>

        <input
          type="file"
          accept="audio/*"
          onchange="uploadFile(event, '${track.id}')"
        >
      </div>

      <div class="section">
        <div class="wave" id="wave-${track.id}"></div>
      </div>

      <div class="section">
        <label>Seek</label>

        <input
          type="range"
          min="0"
          max="100"
          value="0"
          oninput="seekTrack('${track.id}', this.value)"
        >
      </div>

      <div class="loop-row">

        <button onclick="setLoopStart('${track.id}')">
          Set Loop Start
        </button>

        <button onclick="setLoopEnd('${track.id}')">
          Set Loop End
        </button>

        <button onclick="toggleLoop('${track.id}')">
          ${track.loopEnabled ? 'Loop ON' : 'Loop OFF'}
        </button>

      </div>

      <div class="section">
        <label>Volume</label>

        <input
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="${track.volume}"
          oninput="changeVolume('${track.id}', this.value)"
        >
      </div>

      <div class="section">
        <label>Scene</label>

        <input
          type="text"
          placeholder="Scene 3 - Stadium"
          value="${track.scene}"
          oninput="setScene('${track.id}', this.value)"
        >
      </div>

      <div class="section">
        <label>Notes</label>

        <textarea
          placeholder="Cue notes..."
          oninput="setNotes('${track.id}', this.value)"
        >${track.notes}</textarea>
      </div>

    `;

    container.appendChild(div);

    setTimeout(() => {

      if (track.wavesurfer) {
        track.wavesurfer.destroy();
      }

      track.wavesurfer = WaveSurfer.create({
        container: `#wave-${track.id}`,
        waveColor: '#666',
        progressColor: '#32d46d',
        cursorColor: '#fff',
        height: 90,
        barWidth: 2
      });

      if (track.audio.src) {
        track.wavesurfer.load(track.audio.src);
      }

    }, 50);

  });
}

function uploadFile(event, id) {

  const file = event.target.files[0];

  if (!file) return;

  const track = tracks.find(t => t.id == id);

  track.audio.src = URL.createObjectURL(file);

  track.name = file.name.replace(/\.[^/.]+$/, '');

  renderTracks();
}

async function togglePlay(id) {

  const track = tracks.find(t => t.id == id);

  if (!track.audio.src) {
    alert('Upload audio first.');
    return;
  }

  if (track.playing) {

    stopTrack(id);

  } else {

    track.audio.volume = 0;

    await track.audio.play();

    fadeAudio(track.audio, track.volume);

    track.playing = true;

    renderTracks();
  }
}

function stopTrack(id) {

  const track = tracks.find(t => t.id == id);

  fadeAudio(track.audio, 0, () => {

    track.audio.pause();

    track.audio.currentTime = 0;

    track.playing = false;

    track.audio.volume = track.volume;

    renderTracks();
  });
}

function stopAll() {

  tracks.forEach(track => {

    if (!track.playing) return;

    fadeAudio(track.audio, 0, () => {

      track.audio.pause();

      track.audio.currentTime = 0;

      track.playing = false;

      track.audio.volume = track.volume;

      renderTracks();

    });

  });
}

function fadeAudio(audio, target, callback) {

  const interval = setInterval(() => {

    if (audio.volume < target) {

      audio.volume += 0.02;

      if (audio.volume >= target) {
        audio.volume = target;
        clearInterval(interval);
      }

    } else {

      audio.volume -= 0.02;

      if (audio.volume <= target) {

        audio.volume = target;

        clearInterval(interval);

        if (callback) callback();
      }
    }

  }, 40);
}

function seekTrack(id, value) {

  const track = tracks.find(t => t.id == id);

  if (!track.audio.duration) return;

  const time = (value / 100) * track.audio.duration;

  track.audio.currentTime = time;

  if (track.wavesurfer) {
    track.wavesurfer.seekTo(value / 100);
  }
}

function changeVolume(id, value) {

  const track = tracks.find(t => t.id == id);

  track.volume = parseFloat(value);

  track.audio.volume = track.volume;
}

function setLoopStart(id) {

  const track = tracks.find(t => t.id == id);

  track.loopStart = track.audio.currentTime;
}

function setLoopEnd(id) {

  const track = tracks.find(t => t.id == id);

  track.loopEnd = track.audio.currentTime;
}

function toggleLoop(id) {

  const track = tracks.find(t => t.id == id);

  track.loopEnabled = !track.loopEnabled;

  renderTracks();
}

function setScene(id, value) {
  tracks.find(t => t.id == id).scene = value;
}

function setNotes(id, value) {
  tracks.find(t => t.id == id).notes = value;
}

setInterval(() => {

  tracks.forEach(track => {

    if (
      track.playing &&
      track.loopEnabled &&
      track.loopEnd !== null &&
      track.audio.currentTime >= track.loopEnd
    ) {
      track.audio.currentTime = track.loopStart;
    }

  });

}, 100);

addTrack('Rain Ambience');
addTrack('Crowd Chant');
addTrack('Church Bell');

</script>

</body>
</html>

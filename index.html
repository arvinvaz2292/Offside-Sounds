<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Offside Sound App</title>

<!-- WaveSurfer -->
<script src="https://unpkg.com/wavesurfer.js@6"></script>
<script src="https://unpkg.com/wavesurfer.js@6/dist/plugin/wavesurfer.regions.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
  background:#000;
  color:white;
  padding:20px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
  flex-wrap:wrap;
  gap:20px;
}

h1{
  font-size:42px;
}

.subtitle{
  color:#888;
  margin-top:6px;
}

.top-buttons{
  display:flex;
  gap:12px;
}

button{
  border:none;
  cursor:pointer;
}

.add-btn{
  background:white;
  color:black;
  padding:16px 22px;
  border-radius:18px;
  font-size:16px;
  font-weight:bold;
}

.stop-all-btn{
  background:#c8192d;
  color:white;
  padding:16px 22px;
  border-radius:18px;
  font-size:16px;
  font-weight:bold;
}

#tracks{
  display:flex;
  flex-direction:column;
  gap:20px;
}

.track{
  background:#111;
  border:1px solid #222;
  border-radius:28px;
  padding:20px;
  transition:0.25s;
}

.track.playing{
  border:2px solid #32d46d;
  box-shadow:0 0 30px rgba(50,212,109,0.25);
}

.track-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  flex-wrap:wrap;
}

.track-name{
  font-size:28px;
  margin-bottom:8px;
}

.scene{
  color:#32d46d;
  font-size:14px;
}

.controls{
  display:flex;
  gap:10px;
}

.play-btn{
  background:#333;
  color:white;
  padding:18px 34px;
  border-radius:20px;
  font-size:20px;
  font-weight:bold;
}

.play-btn.active{
  background:#32d46d;
  color:black;
}

.stop-btn{
  background:#a81422;
  color:white;
  padding:18px 24px;
  border-radius:20px;
  font-size:16px;
  font-weight:bold;
}

.section{
  margin-top:18px;
}

label{
  display:block;
  margin-bottom:8px;
  color:#aaa;
  font-size:14px;
}

.waveform{
  margin-top:10px;
  border-radius:16px;
  overflow:hidden;
  background:#1a1a1a;
}

.time{
  margin-top:8px;
  color:#888;
  font-size:14px;
}

.loop-buttons{
  display:flex;
  gap:10px;
  margin-top:15px;
  flex-wrap:wrap;
}

.loop-btn{
  background:#333;
  color:white;
  padding:12px 18px;
  border-radius:14px;
  font-weight:bold;
}

.loop-btn.active{
  background:#32d46d;
  color:black;
}

input[type="text"],
textarea{
  width:100%;
  background:#1a1a1a;
  color:white;
  border:none;
  border-radius:14px;
  padding:14px;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.footer{
  margin-top:40px;
  background:#111;
  border:1px solid #222;
  border-radius:28px;
  padding:24px;
}

.footer ol{
  padding-left:20px;
  line-height:1.8;
  color:#bbb;
}

@media(max-width:700px){

  h1{
    font-size:32px;
  }

  .controls{
    width:100%;
  }

  .play-btn{
    flex:1;
  }

}

</style>

</head>

<body>

<div class="header">

  <div>
    <h1>Offside Sound App</h1>
    <div class="subtitle">by Arvin Vaz</div>
  </div>

  <div class="top-buttons">

    <button class="add-btn" onclick="createTrack()">
      + Add Track
    </button>

    <button class="stop-all-btn" onclick="stopAllTracks()">
      STOP ALL
    </button>

  </div>

</div>

<div id="tracks"></div>

<div class="footer">

  <ol>
    <li>Upload audio files.</li>
    <li>Tracks fade in/out over 3 seconds.</li>
    <li>Create draggable loop regions.</li>
    <li>Enable looping for ambience beds.</li>
    <li>Multiple tracks can play simultaneously.</li>
    <li>Designed for stable iPad theatre playback.</li>
  </ol>

</div>

<script>

const tracksContainer =
  document.getElementById('tracks');

let tracks = [];

function createTrack(name='New Track'){

  const id =
    Date.now() + Math.random();

  // CREATE DOM ONCE
  const trackDiv =
    document.createElement('div');

  trackDiv.className = 'track';

  trackDiv.id = `track-${id}`;

  trackDiv.innerHTML = `

    <div class="track-top">

      <div>

        <div class="track-name" id="name-${id}">
          ${name}
        </div>

        <div class="scene" id="scene-display-${id}">
          No Scene
        </div>

      </div>

      <div class="controls">

        <button
          class="play-btn"
          id="play-${id}"
        >
          PLAY
        </button>

        <button
          class="stop-btn"
          id="stop-${id}"
        >
          STOP
        </button>

      </div>

    </div>

    <div class="section">

      <label>Upload Audio</label>

      <input
        type="file"
        accept=".mp3,.wav,.m4a,.aac,audio/*"
        id="file-${id}"
      >

    </div>

    <div class="section">

      <div
        class="waveform"
        id="wave-${id}"
      ></div>

      <div
        class="time"
        id="time-${id}"
      >
        00:00
      </div>

    </div>

    <div class="section">

      <label>Volume</label>

      <input
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="1"
        id="volume-${id}"
      >

    </div>

    <div class="loop-buttons">

      <button
        class="loop-btn"
        id="loop-create-${id}"
      >
        Create Loop
      </button>

      <button
        class="loop-btn"
        id="loop-toggle-${id}"
      >
        Loop OFF
      </button>

    </div>

    <div class="section">

      <label>Scene Heading</label>

      <input
        type="text"
        id="scene-${id}"
        placeholder="Scene 4"
      >

    </div>

    <div class="section">

      <label>Notes</label>

      <textarea
        id="notes-${id}"
        placeholder="Cue notes..."
      ></textarea>

    </div>

  `;

  tracksContainer.appendChild(trackDiv);

  // WAVESURFER
  const wavesurfer =
    WaveSurfer.create({

      container:`#wave-${id}`,

      waveColor:'#666',

      progressColor:'#32d46d',

      cursorColor:'#fff',

      height:100,

      responsive:true,

      normalize:true,

      backend:'MediaElement',

      plugins:[
        WaveSurfer.regions.create({})
      ]

    });

  const track = {

    id,
    wavesurfer,

    playing:false,

    loopEnabled:false,

    region:null,

    fadeInterval:null

  };

  tracks.push(track);

  // FILE UPLOAD
  document
    .getElementById(`file-${id}`)
    .addEventListener('change',(e)=>{

      const file = e.target.files[0];

      if(!file) return;

      const url =
        URL.createObjectURL(file);

      wavesurfer.load(url);

      document.getElementById(
        `name-${id}`
      ).innerText =
        file.name.replace(/\.[^/.]+$/, '');

    });

  // PLAY
  document
    .getElementById(`play-${id}`)
    .addEventListener('click',()=>{

      if(!wavesurfer.isReady){

        alert('Upload audio first');

        return;
      }

      if(track.playing){

        stopTrack(track);

      } else {

        playTrack(track);

      }

    });

  // STOP
  document
    .getElementById(`stop-${id}`)
    .addEventListener('click',()=>{

      stopTrack(track);

    });

  // VOLUME
  document
    .getElementById(`volume-${id}`)
    .addEventListener('input',(e)=>{

      wavesurfer.setVolume(e.target.value);

    });

  // CREATE LOOP
  document
    .getElementById(`loop-create-${id}`)
    .addEventListener('click',()=>{

      createLoop(track);

    });

  // TOGGLE LOOP
  document
    .getElementById(`loop-toggle-${id}`)
    .addEventListener('click',()=>{

      track.loopEnabled =
        !track.loopEnabled;

      const btn =
        document.getElementById(
          `loop-toggle-${id}`
        );

      if(track.loopEnabled){

        btn.innerText = 'Loop ON';

        btn.classList.add('active');

      } else {

        btn.innerText = 'Loop OFF';

        btn.classList.remove('active');

      }

    });

  // SCENE
  document
    .getElementById(`scene-${id}`)
    .addEventListener('input',(e)=>{

      document.getElementById(
        `scene-display-${id}`
      ).innerText = e.target.value;

    });

  // TIMER
  wavesurfer.on('audioprocess',()=>{

    const current =
      wavesurfer.getCurrentTime();

    const mins =
      Math.floor(current / 60)
      .toString()
      .padStart(2,'0');

    const secs =
      Math.floor(current % 60)
      .toString()
      .padStart(2,'0');

    document.getElementById(
      `time-${id}`
    ).innerText =
      `${mins}:${secs}`;

    // LOOP ENGINE
    if(
      track.loopEnabled &&
      track.region &&
      current >= track.region.end
    ){

      wavesurfer.play(
        track.region.start
      );

    }

  });

}

function playTrack(track){

  const ws = track.wavesurfer;

  ws.setVolume(0);

  ws.play();

  track.playing = true;

  updateTrackUI(track);

  movePlayingTracksToTop();

  let volume = 0;

  clearInterval(track.fadeInterval);

  track.fadeInterval =
    setInterval(()=>{

      volume += 0.02;

      if(volume >= 1){

        volume = 1;

        clearInterval(track.fadeInterval);

      }

      ws.setVolume(volume);

    },60);

}

function stopTrack(track){

  const ws = track.wavesurfer;

  let volume =
    ws.getVolume();

  clearInterval(track.fadeInterval);

  track.fadeInterval =
    setInterval(()=>{

      volume -= 0.02;

      if(volume <= 0){

        volume = 0;

        clearInterval(track.fadeInterval);

        ws.pause();

        track.playing = false;

        updateTrackUI(track);

      }

      ws.setVolume(volume);

    },60);

}

function updateTrackUI(track){

  const div =
    document.getElementById(
      `track-${track.id}`
    );

  const playBtn =
    document.getElementById(
      `play-${track.id}`
    );

  if(track.playing){

    div.classList.add('playing');

    playBtn.classList.add('active');

    playBtn.innerText = 'PLAYING';

  } else {

    div.classList.remove('playing');

    playBtn.classList.remove('active');

    playBtn.innerText = 'PLAY';

  }

}

function stopAllTracks(){

  tracks.forEach(track=>{

    if(track.playing){

      stopTrack(track);

    }

  });

}

function createLoop(track){

  const ws = track.wavesurfer;

  ws.clearRegions();

  const current =
    ws.getCurrentTime();

  const region =
    ws.addRegion({

      start:current,

      end:current + 5,

      color:'rgba(50,212,109,0.25)',

      drag:true,

      resize:true

    });

  track.region = region;

}

function movePlayingTracksToTop(){

  const playing =
    tracks.filter(t=>t.playing);

  const stopped =
    tracks.filter(t=>!t.playing);

  [...playing,...stopped]
    .forEach(track=>{

      tracksContainer.appendChild(
        document.getElementById(
          `track-${track.id}`
        )
      );

    });

}

// STARTER TRACKS
createTrack('Rain Ambience');
createTrack('Tension Drone');
createTrack('Church Bell');

</script>

</body>
</html>

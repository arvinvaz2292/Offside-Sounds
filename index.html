<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Offside Sound App</title>

<script src="https://unpkg.com/wavesurfer.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
  background:#050505;
  color:white;
  padding:20px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
  flex-wrap:wrap;
  gap:15px;
}

h1{
  font-size:42px;
}

.subtitle{
  color:#777;
  margin-top:5px;
}

.top-buttons{
  display:flex;
  gap:10px;
}

button{
  border:none;
  cursor:pointer;
  transition:0.2s;
}

.add-btn{
  background:white;
  color:black;
  padding:14px 22px;
  border-radius:18px;
  font-weight:bold;
  font-size:16px;
}

.stop-all-btn{
  background:#d11a2a;
  color:white;
  padding:14px 22px;
  border-radius:18px;
  font-weight:bold;
  font-size:16px;
}

.tracks{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.track{
  background:#111;
  border:1px solid #222;
  border-radius:28px;
  padding:20px;
  transition:0.25s;
}

.track.playing{
  border:2px solid #32d46d;
  box-shadow:0 0 30px rgba(50,212,109,0.3);
}

.track-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:15px;
}

.track-title{
  font-size:28px;
  font-weight:700;
}

.scene{
  color:#32d46d;
  font-size:14px;
  margin-top:6px;
}

.controls{
  display:flex;
  gap:10px;
}

.play-btn{
  background:#333;
  color:white;
  border-radius:20px;
  padding:22px 40px;
  font-size:22px;
  font-weight:bold;
}

.play-btn.playing{
  background:#32d46d;
  color:black;
}

.stop-btn{
  background:#8b1018;
  color:white;
  border-radius:20px;
  padding:0 26px;
  font-size:18px;
  font-weight:bold;
}

.section{
  margin-top:18px;
}

label{
  display:block;
  margin-bottom:8px;
  color:#888;
  font-size:14px;
}

input[type="file"]{
  width:100%;
  color:white;
}

input[type="range"]{
  width:100%;
}

.wave-holder{
  background:#181818;
  border-radius:16px;
  overflow:hidden;
}

textarea,
input[type="text"]{
  width:100%;
  background:#1b1b1b;
  color:white;
  border:none;
  border-radius:14px;
  padding:14px;
  font-size:15px;
}

textarea{
  resize:vertical;
  min-height:90px;
}

.loop-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#1a1a1a;
  padding:14px 16px;
  border-radius:18px;
  margin-top:18px;
}

.loop-btn{
  background:#333;
  color:white;
  border-radius:14px;
  padding:10px 18px;
  font-weight:bold;
}

.loop-btn.active{
  background:#32d46d;
  color:black;
}

.footer{
  margin-top:40px;
  padding:24px;
  border-radius:28px;
  border:1px solid #222;
  background:#111;
}

.footer ol{
  padding-left:20px;
  line-height:1.9;
  color:#aaa;
}

@media(max-width:700px){

  h1{
    font-size:32px;
  }

  .track-top{
    flex-direction:column;
  }

  .controls{
    width:100%;
  }

  .play-btn{
    flex:1;
  }

}

</style>

</head>

<body>

<div class="header">

  <div>
    <h1>Offside Sound App</h1>
    <div class="subtitle">by Arvin Vaz</div>
  </div>

  <div class="top-buttons">

    <button class="add-btn" onclick="addTrack()">
      + Add Track
    </button>

    <button class="stop-all-btn" onclick="stopAll()">
      STOP ALL
    </button>

  </div>

</div>

<div class="tracks" id="tracks"></div>

<div class="footer">

  <h2 style="margin-bottom:12px;">How To Use</h2>

  <ol>
    <li>Upload tracks.</li>
    <li>Press PLAY to fade in.</li>
    <li>STOP fades out the cue.</li>
    <li>STOP ALL fades out everything.</li>
    <li>Playing tracks move to the top.</li>
    <li>Create loop regions.</li>
    <li>Add scene headings and backstage notes.</li>
  </ol>

</div>

<script>

let tracks = [];

function createTrack(name='New Track'){

  const audio = new Audio();

  const track = {

    id:Date.now()+Math.random(),

    name,

    audio,

    playing:false,

    volume:1,

    loopEnabled:false,

    loopStart:0,

    loopEnd:null,

    wavesurfer:null,

    notes:'',

    scene:''

  };

  tracks.push(track);

  renderTracks();
}

function renderTracks(){

  tracks.sort((a,b)=> b.playing - a.playing);

  const container = document.getElementById('tracks');

  container.innerHTML='';

  tracks.forEach(track=>{

    const div = document.createElement('div');

    div.className = track.playing
      ? 'track playing'
      : 'track';

    div.innerHTML = `

      <div class="track-top">

        <div>

          <div class="track-title">
            ${track.name}
          </div>

          <div class="scene">
            ${track.scene || 'No Scene Assigned'}
          </div>

        </div>

        <div class="controls">

          <button
            class="play-btn ${track.playing ? 'playing' : ''}"
            onclick="togglePlay('${track.id}')"
          >
            ${track.playing ? 'PLAYING' : 'PLAY'}
          </button>

          <button
            class="stop-btn"
            onclick="stopTrack('${track.id}')"
          >
            STOP
          </button>

        </div>

      </div>

      <div class="section">

        <label>Upload Audio</label>

        <input
          type="file"
          accept=".mp3,.wav,.m4a,.aac,audio/*"
          onchange="uploadFile(event,'${track.id}')"
        >

      </div>

      <div class="section">

        <div
          class="wave-holder"
          id="wave-${track.id}"
        ></div>

      </div>

      <div class="section">

        <label>Seek</label>

        <input
          type="range"
          min="0"
          max="100"
          value="0"
          oninput="seekTrack('${track.id}', this.value)"
        >

      </div>

      <div class="section">

        <label>Volume</label>

        <input
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="${track.volume}"
          oninput="changeVolume('${track.id}', this.value)"
        >

      </div>

      <div class="loop-row">

        <span>Loop Region</span>

        <button
          class="loop-btn ${track.loopEnabled ? 'active' : ''}"
          onclick="toggleLoop('${track.id}')"
        >
          ${track.loopEnabled ? 'ON' : 'OFF'}
        </button>

      </div>

      <div class="section">

        <label>Loop Start %</label>

        <input
          type="range"
          min="0"
          max="100"
          value="${track.loopStartPercent || 0}"
          oninput="setLoopStart('${track.id}', this.value)"
        >

      </div>

      <div class="section">

        <label>Loop End %</label>

        <input
          type="range"
          min="0"
          max="100"
          value="${track.loopEndPercent || 100}"
          oninput="setLoopEnd('${track.id}', this.value)"
        >

      </div>

      <div class="section">

        <label>Scene</label>

        <input
          type="text"
          placeholder="Scene 4 - Church Riot"
          value="${track.scene}"
          oninput="setScene('${track.id}', this.value)"
        >

      </div>

      <div class="section">

        <label>Notes</label>

        <textarea
          placeholder="Cue notes..."
          oninput="setNotes('${track.id}', this.value)"
        >${track.notes}</textarea>

      </div>

    `;

    container.appendChild(div);

    setTimeout(()=>{

      if(track.wavesurfer){
        track.wavesurfer.destroy();
      }

      track.wavesurfer = WaveSurfer.create({

        container:`#wave-${track.id}`,

        waveColor:'#555',

        progressColor:'#32d46d',

        cursorColor:'#fff',

        height:90,

        responsive:true,

        normalize:true,

        barWidth:2

      });

      if(track.audio.src){
        track.wavesurfer.load(track.audio.src);
      }

    },100);

  });

}

function uploadFile(event,id){

  const file = event.target.files[0];

  if(!file) return;

  const track = tracks.find(t=>t.id==id);

  const url = URL.createObjectURL(file);

  track.audio.src = url;

  track.name = file.name.replace(/\.[^/.]+$/, '');

  renderTracks();
}

async function togglePlay(id){

  const track = tracks.find(t=>t.id==id);

  if(!track.audio.src){
    alert('Upload audio first.');
    return;
  }

  if(track.playing){

    stopTrack(id);

  } else {

    track.audio.volume = 0;

    await track.audio.play();

    fadeAudio(track.audio, track.volume);

    track.playing = true;

    renderTracks();
  }

}

function stopTrack(id){

  const track = tracks.find(t=>t.id==id);

  fadeAudio(track.audio,0,()=>{

    track.audio.pause();

    track.audio.currentTime = 0;

    track.playing = false;

    track.audio.volume = track.volume;

    renderTracks();

  });

}

function stopAll(){

  tracks.forEach(track=>{

    if(track.playing){

      fadeAudio(track.audio,0,()=>{

        track.audio.pause();

        track.audio.currentTime = 0;

        track.playing = false;

        track.audio.volume = track.volume;

        renderTracks();

      });

    }

  });

}

function fadeAudio(audio,target,callback){

  const fade = setInterval(()=>{

    if(audio.volume < target){

      audio.volume += 0.02;

      if(audio.volume >= target){

        audio.volume = target;

        clearInterval(fade);

      }

    } else {

      audio.volume -= 0.02;

      if(audio.volume <= target){

        audio.volume = target;

        clearInterval(fade);

        if(callback) callback();

      }

    }

  },40);

}

function seekTrack(id,value){

  const track = tracks.find(t=>t.id==id);

  if(!track.audio.duration) return;

  const time =
    (value / 100) * track.audio.duration;

  track.audio.currentTime = time;

  if(track.wavesurfer){
    track.wavesurfer.seekTo(value / 100);
  }

}

function changeVolume(id,value){

  const track = tracks.find(t=>t.id==id);

  track.volume = value;

  track.audio.volume = value;
}

function toggleLoop(id){

  const track = tracks.find(t=>t.id==id);

  track.loopEnabled = !track.loopEnabled;

  renderTracks();
}

function setLoopStart(id,value){

  const track = tracks.find(t=>t.id==id);

  track.loopStartPercent = value;

  if(track.audio.duration){

    track.loopStart =
      (value / 100) * track.audio.duration;
  }

}

function setLoopEnd(id,value){

  const track = tracks.find(t=>t.id==id);

  track.loopEndPercent = value;

  if(track.audio.duration){

    track.loopEnd =
      (value / 100) * track.audio.duration;
  }

}

function setScene(id,value){

  const track = tracks.find(t=>t.id==id);

  track.scene = value;
}

function setNotes(id,value){

  const track = tracks.find(t=>t.id==id);

  track.notes = value;
}

setInterval(()=>{

  tracks.forEach(track=>{

    if(
      track.playing &&
      track.loopEnabled &&
      track.loopEnd &&
      track.audio.currentTime >= track.loopEnd
    ){

      track.audio.currentTime = track.loopStart;
    }

  });

},100);

function addTrack(){
  createTrack();
}

createTrack('Rain Ambience');
createTrack('Tension Drone');
createTrack('Church Bell');

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Offside Sound v6 · by Arvin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
<script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
<style>
:root{
  --bg:#060809;--s1:#0d1114;--s2:#131820;--s3:#192028;--s4:#1e2830;
  --border:#1e2830;--border2:#131a20;
  --green:#00e676;--green2:#00a854;--green-dim:rgba(0,230,118,.10);
  --amber:#ffc107;--red:#ff4444;--blue:#40c4ff;
  --muted:#3d5060;--muted2:#607080;--text:#cdd8e0;--text2:#7a9ab0;
  --mono:'IBM Plex Mono',monospace;--display:'Bebas Neue',sans-serif;
  --r:12px;--r-sm:7px;
  --cat-bgm:#40c4ff;--cat-sfx:#ffc107;--cat-amb:#00e676;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.06) 3px,rgba(0,0,0,.06) 4px);pointer-events:none;z-index:9000}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:500;height:56px;background:rgba(6,8,9,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px}
.brand-name{font-family:var(--display);font-size:26px;letter-spacing:3px;line-height:1;flex-shrink:0}
.brand-sub{font-size:8px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;flex-shrink:0;margin-right:6px}
.topbar-sep{width:1px;height:28px;background:var(--border);flex-shrink:0}
.master-row{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--muted2);letter-spacing:1px;flex-shrink:0}
.master-row input[type=range]{width:80px}
.master-val{color:var(--green);min-width:32px;font-weight:600}
.topbar-right{display:flex;gap:7px;margin-left:auto;align-items:center}
button{border:none;cursor:pointer;font-family:var(--mono);transition:all .14s}
.btn{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;padding:7px 13px;border-radius:var(--r-sm)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted2)}.btn-ghost:hover{border-color:var(--muted2);color:var(--text)}
.btn-amber{background:transparent;border:1px solid var(--amber);color:var(--amber)}.btn-amber:hover{background:var(--amber);color:#000}
.btn-green{background:var(--green2);color:#000;border:none}.btn-green:hover{background:var(--green)}
.btn-stopall{background:transparent;border:1px solid var(--red);color:var(--red);position:relative;overflow:hidden;font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;padding:7px 13px;border-radius:var(--r-sm)}
.btn-stopall:hover{background:rgba(255,68,68,.1)}
.btn-stopall.fading{border-color:#ff8800;color:#ff8800;animation:pulse .6s infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.5}}
.stopall-progress{position:absolute;bottom:0;left:0;height:2px;background:var(--red);width:0}
.upload-btn-wrap{position:relative}
.upload-btn-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

/* ── TWO-COLUMN LAYOUT ── */
.app-body{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 56px - 34px);overflow:hidden}

/* ── SCENES SIDEBAR ── */
.scenes-sidebar{background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:12px 14px 8px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:8px;flex-shrink:0}
.sidebar-title{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted2);flex:1}
.sidebar-scene-list{flex:1;overflow-y:auto;padding:8px}
.sidebar-scene-list::-webkit-scrollbar{width:4px}
.sidebar-scene-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.scene-item{border-radius:10px;border:1px solid var(--border);overflow:hidden;margin-bottom:6px;transition:border-color .2s,box-shadow .2s;cursor:pointer}
.scene-item:hover{border-color:var(--muted)}
.scene-item.active{border-color:var(--green);box-shadow:0 0 0 1px var(--green2),0 0 20px rgba(0,230,118,.1)}
.scene-item-header{display:flex;align-items:center;padding:8px 10px;gap:6px;background:var(--s2)}
.scene-active-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .2s}
.scene-item.active .scene-active-dot{background:var(--green);box-shadow:0 0 6px var(--green)}
.scene-item-name{font-size:12px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.scene-item.active .scene-item-name{color:var(--green)}
.scene-item-actions{display:flex;gap:2px;flex-shrink:0}
.scene-icon-btn{background:transparent;border:none;color:var(--muted);font-size:11px;width:20px;height:20px;border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s}
.scene-icon-btn:hover{color:var(--text);background:var(--s3)}
.scene-icon-btn.del:hover{color:var(--red)}
.scene-item-preview{background:var(--s1);padding:4px 10px 6px;display:flex;flex-direction:column;gap:2px}
.scene-preview-row{font-size:9px;color:var(--muted2);display:flex;align-items:center;gap:5px}
.spd{width:5px;height:5px;border-radius:50%;background:var(--muted);flex-shrink:0}
.spd.on{background:var(--green)}
.spn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spv{color:var(--muted);font-size:8px;flex-shrink:0}
.scene-item-footer{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--border2)}
.scene-btn{background:transparent;border:none;color:var(--muted2);font-size:8px;letter-spacing:1px;padding:6px;cursor:pointer;font-family:var(--mono);font-weight:600;text-transform:uppercase;transition:all .12s;text-align:center}
.scene-btn:not(:last-child){border-right:1px solid var(--border2)}
.scene-btn.fire:hover{background:var(--green2);color:#fff}
.scene-btn.xfade:hover{background:#1a3040;color:var(--blue)}
.scene-btn.update:hover{background:rgba(255,193,7,.12);color:var(--amber)}
.scene-fade-row{display:flex;align-items:center;gap:5px;padding:4px 10px;border-top:1px solid var(--border2);font-size:8px;color:var(--muted)}
.scene-fade-row input{width:32px;background:var(--s3);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:var(--mono);font-size:8px;padding:2px 4px;outline:none;text-align:center}
.scene-fade-row input:focus{border-color:var(--blue)}
.scene-name-input{font-family:var(--mono);font-size:12px;font-weight:600;background:transparent;border:none;border-bottom:1px solid var(--green);color:var(--text);outline:none;width:100%}
.sidebar-footer{border-top:1px solid var(--border2);padding:8px;flex-shrink:0;display:flex;flex-direction:column;gap:5px}
.btn-add-scene{background:var(--s2);border:1px dashed var(--border);color:var(--muted2);font-size:9px;padding:7px;border-radius:var(--r-sm);letter-spacing:1px;cursor:pointer;font-family:var(--mono);transition:all .14s;width:100%;text-align:center}
.btn-add-scene:hover{border-color:var(--amber);color:var(--amber)}
.persist-row{display:flex;gap:5px}
.btn-persist{flex:1;font-size:8px;letter-spacing:1px;padding:6px 4px;border-radius:5px;text-align:center;font-family:var(--mono);font-weight:600;text-transform:uppercase}
.btn-export{background:var(--s3);border:1px solid var(--border);color:var(--muted2)}.btn-export:hover{border-color:var(--blue);color:var(--blue)}
.btn-import{background:var(--s3);border:1px solid var(--border);color:var(--muted2);position:relative}.btn-import:hover{border-color:var(--amber);color:var(--amber)}
.btn-import input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

/* ── TRACK AREA ── */
.track-area{overflow-y:auto;display:flex;flex-direction:column;gap:0}
.track-area::-webkit-scrollbar{width:5px}
.track-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* active-scene track pool (top) */
.active-pool{padding:14px 16px 6px;display:flex;flex-direction:column;gap:8px;border-bottom:2px solid var(--border2);min-height:60px}
.active-pool-label{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--green2);margin-bottom:2px}

/* inactive pool */
.inactive-pool{padding:10px 16px 80px;display:flex;flex-direction:column;gap:0}
.inactive-pool-label{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);padding:6px 0 8px;display:flex;align-items:center;gap:8px}
.inactive-pool-label::after{content:'';flex:1;height:1px;background:var(--border2)}

/* cat group label inside inactive pool */
.cat-group-label{font-size:8px;letter-spacing:2px;text-transform:uppercase;padding:8px 0 4px;display:flex;align-items:center;gap:8px}
.cat-group-label span{padding:2px 8px;border-radius:10px;border:1px solid}
.cat-group-label.BGM span{color:var(--cat-bgm);border-color:rgba(64,196,255,.3);background:rgba(64,196,255,.06)}
.cat-group-label.SFX span{color:var(--cat-sfx);border-color:rgba(255,193,7,.3);background:rgba(255,193,7,.06)}
.cat-group-label.AMB span{color:var(--cat-amb);border-color:rgba(0,230,118,.3);background:rgba(0,230,118,.06)}
.cat-group-label::after{content:'';flex:1;height:1px;background:var(--border2)}

/* ── EXPANDED TRACK CARD ── */
.track-card{background:var(--s1);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .2s,box-shadow .2s;animation:cardIn .2s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.track-card.is-playing{border-color:var(--green2);box-shadow:0 0 0 1px var(--green2),0 4px 30px rgba(0,230,118,.08)}
.track-accent-bar{height:2px;background:var(--accent,var(--border))}
.track-card.is-playing .track-accent-bar{background:var(--green)}

/* drag handle */
.drag-handle{cursor:grab;color:var(--muted);font-size:14px;padding:0 4px;user-select:none;flex-shrink:0;display:flex;align-items:center}
.drag-handle:active{cursor:grabbing}
.track-card.drag-over{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}

.card-header{display:flex;align-items:flex-start;padding:11px 14px 7px;gap:8px}
.card-name-wrap{flex:1;min-width:0}
.card-name{font-family:var(--display);font-size:20px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.15;transition:color .12s}
.card-name:hover{color:var(--green)}
.card-name-input{font-family:var(--display);font-size:20px;letter-spacing:1px;background:transparent;border:none;border-bottom:1px solid var(--green);color:var(--text);outline:none;width:100%}
.card-meta-row{display:flex;align-items:center;gap:6px;margin-top:2px}
.card-meta{font-size:9px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.cat-badge{font-size:8px;font-weight:600;letter-spacing:1.5px;padding:2px 6px;border-radius:10px;border:1px solid;cursor:pointer;flex-shrink:0;transition:opacity .12s}
.cat-badge:hover{opacity:.7}
.cat-badge.BGM{color:var(--cat-bgm);border-color:rgba(64,196,255,.4);background:rgba(64,196,255,.08)}
.cat-badge.SFX{color:var(--cat-sfx);border-color:rgba(255,193,7,.4);background:rgba(255,193,7,.08)}
.cat-badge.AMB{color:var(--cat-amb);border-color:rgba(0,230,118,.4);background:rgba(0,230,118,.08)}
.cat-popup{display:none;position:absolute;top:calc(100% + 4px);right:0;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:6px;z-index:100;flex-direction:column;gap:4px;min-width:70px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.cat-popup.open{display:flex}
.cat-popup-btn{background:var(--s3);border:1px solid var(--border);color:var(--muted2);font-size:9px;padding:4px 8px;border-radius:4px;cursor:pointer;font-family:var(--mono);transition:all .1s;text-align:center}
.cat-popup-btn:hover{border-color:var(--green);color:var(--text)}
.card-header-btns{display:flex;gap:3px;padding-top:2px;flex-shrink:0}
.icon-btn{background:transparent;border:1px solid transparent;color:var(--muted);font-size:12px;width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s}
.icon-btn:hover{border-color:var(--border);color:var(--text)}
.icon-btn.del:hover{border-color:var(--red);color:var(--red)}

/* waveform */
.wave-zone{padding:0 14px}
.wave-wrap{background:var(--s2);border-radius:9px;overflow:hidden;height:72px;cursor:crosshair}
.time-strip{display:flex;justify-content:space-between;padding:3px 2px 0;font-size:9px;color:var(--muted2)}
.time-cur{color:var(--green);font-weight:600}

/* transport */
.transport{display:flex;gap:7px;padding:9px 14px 6px;align-items:center}
.btn-play{flex:1;background:var(--s2);border:1px solid var(--border);color:var(--text2);font-size:11px;font-weight:600;letter-spacing:1.5px;padding:10px;border-radius:var(--r-sm);text-transform:uppercase}
.btn-play:hover{border-color:var(--green2);color:var(--green)}
.btn-play.is-playing{background:var(--green);color:#000;border-color:var(--green)}
.btn-stop-t{background:var(--s2);border:1px solid var(--border);color:var(--muted2);width:40px;height:40px;border-radius:var(--r-sm);font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-stop-t:hover{border-color:var(--red);color:var(--red)}

/* speed popup */
.speed-wrap{position:relative;flex-shrink:0}
.speed-badge{background:var(--s2);border:1px solid var(--border);color:var(--muted2);font-size:9px;height:40px;padding:0 9px;border-radius:var(--r-sm);display:flex;align-items:center;gap:3px;cursor:pointer;user-select:none;letter-spacing:1px;white-space:nowrap}
.speed-badge:hover{border-color:var(--blue);color:var(--blue)}
.speed-badge .sv{color:var(--blue);font-weight:600}
.speed-popup{display:none;position:absolute;bottom:calc(100% + 6px);right:0;background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:10px;z-index:200;min-width:165px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.speed-wrap.open .speed-popup{display:block}
.speed-popup-lbl{font-size:9px;color:var(--muted2);display:flex;justify-content:space-between;margin-bottom:6px}
.speed-popup-lbl span{color:var(--blue);font-weight:600}
.speed-presets{display:flex;gap:3px;margin-top:7px;flex-wrap:wrap}
.speed-preset{background:var(--s3);border:1px solid var(--border);color:var(--muted2);font-size:9px;padding:3px 6px;border-radius:4px;cursor:pointer;font-family:var(--mono);transition:all .1s}
.speed-preset:hover{border-color:var(--blue);color:var(--blue)}

/* upload */
.upload-zone{padding:0 14px 6px}
.upload-lbl{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px dashed var(--border);border-radius:var(--r-sm);padding:7px 11px;cursor:pointer;font-size:10px;color:var(--muted);transition:all .14s}
.upload-lbl:hover{border-color:var(--green2);color:var(--green)}
.upload-lbl input{display:none}
.upload-fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── BIG VOLUME SECTION ── */
.vol-section{padding:8px 14px 10px;display:flex;align-items:center;gap:14px}
.vol-knob-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
.vol-pct{font-size:20px;font-weight:600;font-family:var(--display);letter-spacing:1px;color:var(--green);min-width:52px;text-align:center}
.vol-label{font-size:8px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.vol-slider-wrap{flex:1;display:flex;flex-direction:column;gap:10px}
.vol-slider-row{display:flex;align-items:center;gap:8px}
.vol-slider-lbl{font-size:8px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;width:16px;text-align:right;flex-shrink:0}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:4px;background:var(--border);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--green);cursor:pointer;transition:transform .1s,box-shadow .1s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.3);box-shadow:0 0 0 4px rgba(0,230,118,.2)}
input[type=range].blue-r::-webkit-slider-thumb{background:var(--blue)}
.vol-fade-btns{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.btn-vol-fade{width:48px;height:36px;border-radius:var(--r-sm);font-size:16px;display:flex;align-items:center;justify-content:center;background:var(--s2);border:1px solid var(--border);color:var(--text2);transition:all .14s}
.btn-vol-fade:hover{border-color:var(--green);color:var(--green)}
.btn-vol-fade.kill{font-size:13px}.btn-vol-fade.kill:hover{border-color:var(--red);color:var(--red)}

.autostop-row{display:flex;align-items:center;gap:6px;font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;padding:0 14px 6px}
.autostop-row input[type=number]{width:48px;background:var(--s2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:10px;padding:3px 6px;outline:none;text-align:center}
.autostop-row input[type=number]:focus{border-color:var(--green)}

.card-div{height:1px;background:var(--border2);margin:0 14px}

/* ── LOOP ── */
.loop-sec{background:var(--s2);border-top:1px solid var(--border2);border-bottom:1px solid var(--border2);padding:10px 14px}
.loop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.loop-title{font-size:8px;letter-spacing:2px;color:var(--muted2);text-transform:uppercase}
.loop-right{display:flex;align-items:center;gap:8px}
.tog{position:relative;width:32px;height:18px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0;position:absolute}
.tog-track{position:absolute;inset:0;background:var(--s3);border-radius:20px;border:1px solid var(--border);cursor:pointer;transition:background .2s,border-color .2s}
.tog input:checked+.tog-track{background:var(--green2);border-color:var(--green)}
.tog-thumb{position:absolute;top:3px;left:3px;width:10px;height:10px;background:#fff;border-radius:50%;transition:left .18s;pointer-events:none}
.tog input:checked~.tog-thumb{left:17px}
.loop-lbl-state{font-size:8px;color:var(--muted);letter-spacing:1px}
.loop-count-wrap{display:flex;align-items:center;gap:4px;font-size:8px;color:var(--muted)}
.loop-count-wrap input{width:36px;background:var(--s3);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--mono);font-size:9px;padding:2px 4px;outline:none;text-align:center}
.loop-count-wrap input:focus{border-color:var(--green)}
.loop-chips{display:flex;gap:5px;margin-bottom:7px}
.loop-chip{flex:1;background:var(--s3);border:1px solid var(--border);border-radius:6px;padding:5px 7px;font-size:8px;display:flex;flex-direction:column;gap:2px}
.chip-lbl{color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-size:7px}
.chip-val{color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums}
.loop-actions{display:flex;gap:4px;flex-wrap:wrap}
.btn-la{flex:1;min-width:55px;background:var(--s3);border:1px solid var(--border);color:var(--text2);font-size:8px;letter-spacing:1px;text-transform:uppercase;padding:6px 4px;border-radius:5px;cursor:pointer;font-family:var(--mono);transition:all .12s;text-align:center}
.btn-la:hover{border-color:var(--amber);color:var(--amber)}
.loop-hint{font-size:8px;color:var(--muted);font-style:italic;margin-top:6px}

/* ── CUES ── */
.cue-sec{padding:8px 14px}
.cue-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cue-title{font-size:8px;letter-spacing:2px;color:var(--muted2);text-transform:uppercase}
.btn-add-cue{background:transparent;border:1px solid var(--border);color:var(--muted2);font-size:8px;padding:3px 7px;border-radius:4px;cursor:pointer;font-family:var(--mono);transition:all .12s}
.btn-add-cue:hover{border-color:var(--blue);color:var(--blue)}
.cue-list{display:flex;flex-wrap:wrap;gap:4px}
.cue-chip{display:flex;align-items:stretch;border-radius:5px;border:1px solid var(--border);overflow:hidden}
.cue-jump{background:var(--s3);color:var(--text2);padding:4px 7px;cursor:pointer;font-family:var(--mono);font-size:8px;border:none;display:flex;flex-direction:column;gap:1px;transition:background .12s}
.cue-jump:hover{background:var(--blue);color:#000}
.cue-lbl{font-weight:600}
.cue-t{color:var(--muted2);font-size:7px}
.cue-jump:hover .cue-t{color:rgba(0,0,0,.6)}
.cue-rm{background:var(--s2);color:var(--muted);border:none;border-left:1px solid var(--border);padding:4px 5px;cursor:pointer;font-size:10px;transition:all .12s}
.cue-rm:hover{background:var(--red);color:#fff}
.cue-empty{font-size:8px;color:var(--muted);font-style:italic}

/* ── COLLAPSED TRACK ── */
.track-collapsed{background:var(--s1);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:10px;padding:7px 12px;transition:border-color .2s;cursor:default;animation:cardIn .18s ease both;margin-bottom:4px}
.track-collapsed.is-playing{border-color:var(--green2)}
.tc-accent{width:3px;height:32px;border-radius:2px;background:var(--accent,var(--border));flex-shrink:0}
.track-collapsed.is-playing .tc-accent{background:var(--green)}
.tc-drag{cursor:grab;color:var(--muted);font-size:12px;flex-shrink:0}
.tc-name{font-family:var(--display);font-size:16px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;line-height:1}
.tc-cat{font-size:7px;font-weight:600;letter-spacing:1.5px;padding:1px 5px;border-radius:8px;border:1px solid;flex-shrink:0}
.tc-cat.BGM{color:var(--cat-bgm);border-color:rgba(64,196,255,.4);background:rgba(64,196,255,.08)}
.tc-cat.SFX{color:var(--cat-sfx);border-color:rgba(255,193,7,.4);background:rgba(255,193,7,.08)}
.tc-cat.AMB{color:var(--cat-amb);border-color:rgba(0,230,118,.4);background:rgba(0,230,118,.08)}
.tc-vol-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0;width:160px}
.tc-vol-pct{font-size:12px;font-weight:600;color:var(--green);min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.tc-play{background:var(--s2);border:1px solid var(--border);color:var(--text2);width:34px;height:34px;border-radius:7px;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tc-play:hover{border-color:var(--green2);color:var(--green)}
.tc-play.on{background:var(--green);color:#000;border-color:var(--green)}
.tc-stop{background:var(--s2);border:1px solid var(--border);color:var(--muted2);width:34px;height:34px;border-radius:7px;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tc-stop:hover{border-color:var(--red);color:var(--red)}
.tc-expand{background:transparent;border:none;color:var(--muted);font-size:11px;width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.tc-expand:hover{color:var(--text)}

/* ── STATUS BAR ── */
.status-bar{position:fixed;bottom:0;left:0;right:0;height:34px;background:rgba(6,8,9,.97);border-top:1px solid var(--border);display:flex;align-items:center;gap:20px;padding:0 20px;font-size:9px;color:var(--muted);letter-spacing:1.2px;z-index:600}
.status-item{display:flex;align-items:center;gap:5px}
.status-val{color:var(--text2)}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--muted);flex-shrink:0}
.live-dot.on{background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.kb-hint{margin-left:auto;font-size:8px;color:var(--muted);display:flex;gap:10px}
.kb-key{background:var(--s2);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-size:7px}
.toast{position:fixed;top:66px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--green2);color:var(--green);font-size:10px;padding:7px 16px;border-radius:7px;z-index:9999;letter-spacing:1px;pointer-events:none;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}

/* scene notes textarea in sidebar */
.scene-notes-wrap{padding:5px 10px 6px;border-top:1px solid var(--border2)}
.scene-notes{width:100%;background:transparent;border:none;color:var(--text2);font-family:var(--mono);font-size:9px;line-height:1.6;resize:none;outline:none;min-height:38px;max-height:120px;letter-spacing:.3px;overflow-y:auto}
.scene-notes::placeholder{color:var(--muted)}
.scene-notes:focus{color:var(--text)}

/* prominent notes banner shown in track area when scene is active */
.notes-banner{background:rgba(255,193,7,.07);border:1px solid rgba(255,193,7,.25);border-radius:10px;padding:11px 15px;margin-bottom:10px;display:none;animation:cardIn .2s ease both}
.notes-banner.visible{display:block}
.notes-banner-label{font-size:8px;letter-spacing:2px;color:var(--amber);text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.notes-banner-label::after{content:'';flex:1;height:1px;background:rgba(255,193,7,.2)}
.notes-banner-text{font-size:13px;color:var(--text);line-height:1.75;white-space:pre-wrap;word-break:break-word;font-family:var(--mono)}
@media(max-width:800px){.app-body{grid-template-columns:200px 1fr}.brand-sub{display:none}}
</style>
</head>
<body>

<!-- ══ TOPBAR ══ -->
<div class="topbar">
  <span class="brand-name">OFFSIDE</span>
  <span class="brand-sub">v6 · by Arvin</span>
  <div class="topbar-sep"></div>
  <div class="master-row">
    <span>MASTER</span>
    <input type="range" min="0" max="1" step="0.01" value="1" oninput="setMaster(this.value)">
    <span class="master-val" id="master-val">100%</span>
  </div>
  <div class="topbar-right">
    <label class="btn btn-green upload-btn-wrap">
      ↑ UPLOAD
      <input type="file" accept=".mp3,.wav,.m4a,.aac,audio/*" multiple onchange="uploadMulti(event)">
    </label>
    <button class="btn btn-ghost" onclick="addTrack()">+ TRACK</button>
    <button class="btn btn-amber" onclick="saveScene()">SAVE SCENE</button>
    <button class="btn-stopall" id="stopall-btn" onclick="stopAllFade()">
      <span id="stopall-lbl">↓ FADE ALL</span>
      <div class="stopall-progress" id="stopall-progress"></div>
    </button>
  </div>
</div>

<!-- ══ BODY ══ -->
<div class="app-body">

  <!-- SCENES SIDEBAR -->
  <div class="scenes-sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Scenes</span>
      <span style="font-size:9px;background:var(--s3);border:1px solid var(--border);color:var(--muted2);padding:1px 6px;border-radius:10px" id="scene-count">0</span>
    </div>
    <div class="sidebar-scene-list" id="scene-list"></div>
    <div class="sidebar-footer">
      <button class="btn-add-scene" onclick="saveScene()">+ Save current state as scene</button>
      <div class="persist-row">
        <button class="btn-persist btn-export" onclick="exportState()">↓ Export</button>
        <label class="btn-persist btn-import">
          ↑ Import
          <input type="file" accept=".json" onchange="importState(event)">
        </label>
      </div>
    </div>
  </div>

  <!-- TRACK AREA -->
  <div class="track-area" id="track-area">
    <!-- active scene tracks (expanded) -->
    <div class="active-pool" id="active-pool">
      <div class="active-pool-label" id="active-pool-label" style="display:none">NOW PLAYING</div>
      <div class="notes-banner" id="notes-banner">
        <div class="notes-banner-label">Scene Notes</div>
        <div class="notes-banner-text" id="notes-banner-text"></div>
      </div>
    </div>
    <!-- all other tracks (collapsed) -->
    <div class="inactive-pool" id="inactive-pool">
      <div class="inactive-pool-label">ALL TRACKS</div>
    </div>
  </div>

</div>

<!-- STATUS -->
<div class="status-bar">
  <div class="status-item"><div class="live-dot" id="live-dot"></div><span id="st-playing">0 PLAYING</span></div>
  <div class="status-item">TRACKS <span class="status-val" id="st-tracks">0</span></div>
  <div class="status-item">MASTER <span class="status-val" id="st-master">100%</span></div>
  <div class="status-item" id="st-loop" style="display:none">LOOP ACTIVE</div>
  <div class="kb-hint">
    <span><span class="kb-key">1-9</span> trigger</span>
    <span><span class="kb-key">S</span> fade all</span>
    <span><span class="kb-key">Esc</span> stop all</span>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let tracks=[], scenes=[], masterVol=1, uid=0, activeSceneId=null;
const seekDragging={};
const CAT_ORDER=['BGM','SFX','AMB'];
const CAT_ACCENTS={
  BGM:['#40c4ff','#29b6f6','#81d4fa','#4fc3f7'],
  SFX:['#ffc107','#ffab00','#ffe082','#ffd54f'],
  AMB:['#00e676','#00c853','#69f0ae','#00bfa5'],
};
let catC={BGM:0,SFX:0,AMB:0};
// which track ids are "expanded" (user manually opened them)
const expandedIds=new Set();

function mkTrack(name='New Track',cat='AMB'){
  const idx=catC[cat]++%CAT_ACCENTS[cat].length;
  return{id:++uid,name,cat,src:null,filename:null,
    playing:false,volume:1,speed:1,
    loopEnabled:false,loopStart:null,loopEnd:null,loopCount:0,loopPlays:0,
    autoStop:0,autoStopTimer:null,fadeTimer:null,
    cues:[],ws:null,region:null,_rp:null,
    accent:CAT_ACCENTS[cat][idx],order:uid};
}
function effectiveVol(t){return t.volume*masterVol;}
function t_byId(id){return tracks.find(t=>t.id===id);}

// ═══════════════════════════════════════════
// MASTER VOL
// ═══════════════════════════════════════════
function setMaster(v){
  masterVol=parseFloat(v);
  const pct=Math.round(masterVol*100)+'%';
  document.getElementById('master-val').textContent=pct;
  document.getElementById('st-master').textContent=pct;
  tracks.forEach(t=>{if(t.ws)t.ws.setVolume(effectiveVol(t));});
}

// ═══════════════════════════════════════════
// UPLOAD
// ═══════════════════════════════════════════
function guessCat(name){
  const n=name.toLowerCase();
  if(/music|bgm|theme|score|ost|song/.test(n)) return 'BGM';
  if(/sfx|effect|hit|click|beep|buzz|ding|whoosh|snap|shot|door|foot/.test(n)) return 'SFX';
  return 'AMB';
}
function uploadMulti(event){
  const files=Array.from(event.target.files); if(!files.length) return;
  files.forEach(f=>{
    const cat=guessCat(f.name);
    const t=mkTrack(f.name.replace(/\.[^/.]+$/,''),cat);
    t.src=URL.createObjectURL(f); t.filename=f.name;
    tracks.push(t);
  });
  renderAll();
  showToast(`↑ ${files.length} track${files.length>1?'s':''} added`);
  event.target.value='';
}
function uploadSingle(event,id){
  const f=event.target.files[0]; if(!f) return;
  const t=t_byId(id); if(!t) return;
  if(t.src) URL.revokeObjectURL(t.src);
  t.src=URL.createObjectURL(f); t.filename=f.name;
  t.name=f.name.replace(/\.[^/.]+$/,''); t.playing=false;
  t.loopStart=null; t.loopEnd=null;
  renderAll();
}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);}

// ═══════════════════════════════════════════
// RENDER ALL
// ═══════════════════════════════════════════
function renderAll(){
  renderTrackArea();
  renderScenes();
  updateStatus();
  autoSave();
}

function renderTrackArea(){
  const activePool=document.getElementById('active-pool');
  const inactivePool=document.getElementById('inactive-pool');

  // active scene track ids
  const activeScene=scenes.find(s=>s.id===activeSceneId);
  const activeIds=activeScene?new Set(activeScene.snapshot.map(sn=>sn.id)):new Set();
  const playingIds=new Set(tracks.filter(t=>t.playing).map(t=>t.id));
  const shownExpanded=new Set([...activeIds,...playingIds,...expandedIds]);

  // ── Rebuild active pool without clobbering the notes banner ──
  // Remove old track cards only — leave the label and banner divs intact
  activePool.querySelectorAll('.track-card').forEach(el=>el.remove());

  // Update the NOW PLAYING label
  let poolLabel=document.getElementById('active-pool-label');
  if(!poolLabel){
    poolLabel=document.createElement('div');
    poolLabel.className='active-pool-label';
    poolLabel.id='active-pool-label';
    activePool.insertBefore(poolLabel,activePool.firstChild);
  }
  poolLabel.style.display=shownExpanded.size>0?'block':'none';
  poolLabel.textContent='NOW PLAYING';

  // sort tracks by .order
  const sorted=[...tracks].sort((a,b)=>a.order-b.order);

  // Append expanded cards
  sorted.forEach(t=>{
    if(shownExpanded.has(t.id)){
      const card=buildExpandedCard(t);
      activePool.appendChild(card);
      if(!t.ws) initWS(t);
      else {
        const container=document.getElementById(`wave-${t.id}`);
        if(container) reattachWS(t,container);
      }
    }
  });

  // ── Rebuild inactive pool ──
  inactivePool.innerHTML='<div class="inactive-pool-label">ALL TRACKS</div>';
  CAT_ORDER.forEach(cat=>{
    const catTracks=sorted.filter(t=>t.cat===cat&&!shownExpanded.has(t.id));
    if(catTracks.length===0) return;
    const lbl=document.createElement('div');
    lbl.className=`cat-group-label ${cat}`;
    lbl.innerHTML=`<span>${cat}</span>`;
    inactivePool.appendChild(lbl);
    catTracks.forEach(t=>{ inactivePool.appendChild(buildCollapsedRow(t)); });
  });
}

// ═══════════════════════════════════════════
// EXPANDED CARD
// ═══════════════════════════════════════════
function buildExpandedCard(t){
  const div=document.createElement('div');
  div.className='track-card'+(t.playing?' is-playing':'');
  div.id=`card-${t.id}`;
  div.style.setProperty('--accent',t.accent);
  div.draggable=true;
  div.addEventListener('dragstart',e=>onDragStart(e,t.id));
  div.addEventListener('dragover',e=>onDragOver(e,t.id));
  div.addEventListener('drop',e=>onDrop(e,t.id));
  div.addEventListener('dragend',()=>onDragEnd());

  const lsStr=t.loopStart!==null?fmtT(t.loopStart):'--:--';
  const leStr=t.loopEnd!==null  ?fmtT(t.loopEnd)  :'--:--';
  const llStr=(t.loopStart!==null&&t.loopEnd!==null)?fmtT(t.loopEnd-t.loopStart):'--:--';

  div.innerHTML=`
<div class="track-accent-bar"></div>
<div class="card-header">
  <span class="drag-handle" title="Drag to reorder">⠿</span>
  <div class="card-name-wrap">
    <div class="card-name" id="name-${t.id}" ondblclick="renameStart(${t.id})" title="Double-click to rename">${esc(t.name)}</div>
    <div class="card-meta-row">
      <div class="card-meta">${t.filename?esc(t.filename):'No file'}</div>
      <div style="position:relative" id="cbw-${t.id}">
        <span class="cat-badge ${t.cat}" onclick="toggleCatPop(${t.id})">${t.cat}</span>
        <div class="cat-popup" id="cpop-${t.id}">
          ${CAT_ORDER.filter(c=>c!==t.cat).map(c=>`<button class="cat-popup-btn" onclick="setCat(${t.id},'${c}')">${c}</button>`).join('')}
        </div>
      </div>
    </div>
  </div>
  <div class="card-header-btns">
    <button class="icon-btn" onclick="collapseTrack(${t.id})" title="Collapse">−</button>
    <button class="icon-btn del" onclick="deleteTrack(${t.id})" title="Remove">✕</button>
  </div>
</div>
<div class="wave-zone">
  <div class="wave-wrap" id="wave-${t.id}"></div>
  <div class="time-strip">
    <span class="time-cur" id="tcur-${t.id}">0:00.0</span>
    <span id="tdur-${t.id}" style="color:var(--muted)">--:--</span>
  </div>
</div>
<div class="transport">
  <button class="btn-play${t.playing?' is-playing':''}" id="pbtn-${t.id}" onclick="togglePlay(${t.id})">${t.playing?'⏸  PAUSE':'▶  PLAY'}</button>
  <button class="btn-stop-t" onclick="stopTrack(${t.id})">■</button>
  <div class="speed-wrap" id="sw-${t.id}">
    <div class="speed-badge" onclick="toggleSpeedPop(${t.id})">SPD <span class="sv" id="sv-${t.id}">${t.speed.toFixed(2)}x</span></div>
    <div class="speed-popup" id="sp-${t.id}">
      <div class="speed-popup-lbl">SPEED <span id="sl-${t.id}">${t.speed.toFixed(2)}x</span></div>
      <input type="range" class="blue-r" min="0.25" max="2" step="0.05" value="${t.speed}" oninput="setSpeed(${t.id},parseFloat(this.value),this)">
      <div class="speed-presets">${[0.5,0.75,1,1.25,1.5,2].map(s=>`<button class="speed-preset" onclick="setSpeed(${t.id},${s})">${s}x</button>`).join('')}</div>
    </div>
  </div>
</div>
<div class="upload-zone">
  <label class="upload-lbl"><span>↑</span><span class="upload-fn">${t.filename?esc(t.filename):'Upload audio…'}</span><input type="file" accept=".mp3,.wav,.m4a,.aac,audio/*" onchange="uploadSingle(event,${t.id})"></label>
</div>
<div class="vol-section">
  <div class="vol-knob-wrap">
    <div class="vol-pct" id="vv-${t.id}">${Math.round(t.volume*100)}%</div>
    <div class="vol-label">Volume</div>
  </div>
  <div class="vol-slider-wrap">
    <div class="vol-slider-row">
      <span class="vol-slider-lbl">V</span>
      <input type="range" min="0" max="1" step="0.01" value="${t.volume}" id="vs-${t.id}" oninput="onVol(${t.id},this.value)">
    </div>
    <div class="vol-slider-row">
      <span class="vol-slider-lbl" style="font-size:7px">SK</span>
      <input type="range" id="sks-${t.id}" min="0" max="1000" value="0"
        oninput="onSeek(${t.id},this.value)"
        onmousedown="seekDragging[${t.id}]=true" onmouseup="seekDragging[${t.id}]=false"
        ontouchstart="seekDragging[${t.id}]=true" ontouchend="seekDragging[${t.id}]=false">
    </div>
    <div class="autostop-row" style="padding:0">
      <span>Auto-stop</span>
      <input type="number" id="as-${t.id}" min="0" value="${t.autoStop||''}" placeholder="off" style="width:42px;background:var(--s2);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--mono);font-size:9px;padding:2px 5px;outline:none;text-align:center" oninput="t_byId(${t.id}).autoStop=parseFloat(this.value)||0">
      <span>s</span>
    </div>
  </div>
  <div class="vol-fade-btns">
    <button class="btn-vol-fade" onclick="doFade(${t.id},'in')" title="Fade In">↑</button>
    <button class="btn-vol-fade" onclick="doFade(${t.id},'out')" title="Fade Out">↓</button>
    <button class="btn-vol-fade kill" onclick="killVol(${t.id})" title="Kill volume">✕</button>
  </div>
</div>
<div class="card-div"></div>
<div class="loop-sec">
  <div class="loop-head">
    <span class="loop-title">Loop Region</span>
    <div class="loop-right">
      <span class="loop-lbl-state" id="ll-${t.id}">${t.loopEnabled?'ON':'OFF'}</span>
      <label class="tog">
        <input type="checkbox" ${t.loopEnabled?'checked':''} onchange="toggleLoop(${t.id},this.checked)">
        <div class="tog-track"></div><div class="tog-thumb"></div>
      </label>
      <div class="loop-count-wrap">× <input type="number" min="0" max="99" value="${t.loopCount}" title="Repeats (0=∞)" oninput="t_byId(${t.id}).loopCount=parseInt(this.value)||0;t_byId(${t.id}).loopPlays=0"></div>
    </div>
  </div>
  <div class="loop-chips">
    <div class="loop-chip"><div class="chip-lbl">In</div><div class="chip-val" id="li-${t.id}">${lsStr}</div></div>
    <div class="loop-chip"><div class="chip-lbl">Out</div><div class="chip-val" id="lo-${t.id}">${leStr}</div></div>
    <div class="loop-chip"><div class="chip-lbl">Length</div><div class="chip-val" id="ll2-${t.id}">${llStr}</div></div>
  </div>
  <div class="loop-actions">
    <button class="btn-la" onclick="setLoopPt(${t.id},'start')">SET IN</button>
    <button class="btn-la" onclick="setLoopPt(${t.id},'end')">SET OUT</button>
    <button class="btn-la" onclick="jumpLoop(${t.id},'start')">⏮ IN</button>
    <button class="btn-la" onclick="jumpLoop(${t.id},'end')">OUT ⏭</button>
    <button class="btn-la" onclick="clearLoop(${t.id})">CLEAR</button>
  </div>
  <div class="loop-hint">Drag waveform to draw region · drag edges to trim · SET IN/OUT at playhead</div>
</div>
<div class="card-div"></div>
<div class="cue-sec">
  <div class="cue-head">
    <span class="cue-title">Cue Points</span>
    <button class="btn-add-cue" onclick="addCue(${t.id})">+ Mark</button>
  </div>
  <div class="cue-list" id="cuelist-${t.id}">${renderCues(t)}</div>
</div>`;
  return div;
}

// ═══════════════════════════════════════════
// COLLAPSED ROW
// ═══════════════════════════════════════════
function buildCollapsedRow(t){
  const div=document.createElement('div');
  div.className='track-collapsed'+(t.playing?' is-playing':'');
  div.id=`collapsed-${t.id}`;
  div.style.setProperty('--accent',t.accent);
  div.draggable=true;
  div.addEventListener('dragstart',e=>onDragStart(e,t.id));
  div.addEventListener('dragover',e=>onDragOver(e,t.id));
  div.addEventListener('drop',e=>onDrop(e,t.id));
  div.addEventListener('dragend',()=>onDragEnd());
  div.innerHTML=`
    <span class="tc-drag" title="Drag to reorder">⠿</span>
    <div class="tc-accent"></div>
    <span class="tc-name" ondblclick="expandTrack(${t.id})" title="Double-click to expand">${esc(t.name)}</span>
    <span class="tc-cat ${t.cat}">${t.cat}</span>
    <div class="tc-vol-wrap">
      <input type="range" min="0" max="1" step="0.01" value="${t.volume}"
        style="flex:1" oninput="onVol(${t.id},this.value)">
      <span class="tc-vol-pct" id="tvv-${t.id}">${Math.round(t.volume*100)}%</span>
    </div>
    <button class="tc-play${t.playing?' on':''}" onclick="togglePlay(${t.id})" id="tcbtn-${t.id}">${t.playing?'⏸':'▶'}</button>
    <button class="tc-stop" onclick="stopTrack(${t.id})">■</button>
    <button class="tc-expand" onclick="expandTrack(${t.id})" title="Expand">↗</button>`;
  return div;
}

function expandTrack(id){
  expandedIds.add(id);
  renderTrackArea(); // renderTrackArea handles initWS internally
}
function collapseTrack(id){
  expandedIds.delete(id);
  renderTrackArea();
}

// ═══════════════════════════════════════════
// DRAG & DROP REORDER
// ═══════════════════════════════════════════
let dragId=null;
function onDragStart(e,id){ dragId=id; e.dataTransfer.effectAllowed='move'; }
function onDragOver(e,id){
  e.preventDefault();
  if(id!==dragId){
    document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
    const el=document.getElementById(`card-${id}`)||document.getElementById(`collapsed-${id}`);
    if(el) el.classList.add('drag-over');
  }
}
function onDrop(e,targetId){
  e.preventDefault();
  if(dragId===null||dragId===targetId) return;
  const fromIdx=tracks.findIndex(t=>t.id===dragId);
  const toIdx=tracks.findIndex(t=>t.id===targetId);
  if(fromIdx<0||toIdx<0) return;
  const [moved]=tracks.splice(fromIdx,1);
  tracks.splice(toIdx,0,moved);
  tracks.forEach((t,i)=>t.order=i+1);
  dragId=null;
  renderTrackArea();
}
function onDragEnd(){ dragId=null; document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over')); }

// ═══════════════════════════════════════════
// CATEGORY POPUP
// ═══════════════════════════════════════════
function toggleCatPop(id){
  const pop=document.getElementById(`cpop-${id}`); if(!pop) return;
  const was=pop.classList.contains('open');
  document.querySelectorAll('.cat-popup.open').forEach(p=>p.classList.remove('open'));
  if(!was) pop.classList.add('open');
}
function setCat(id,cat){
  const t=t_byId(id); if(!t) return;
  t.cat=cat;
  const idx=catC[cat]++%CAT_ACCENTS[cat].length;
  t.accent=CAT_ACCENTS[cat][idx];
  document.querySelectorAll('.cat-popup.open').forEach(p=>p.classList.remove('open'));
  renderAll();
}

// ═══════════════════════════════════════════
// WAVESURFER
// ═══════════════════════════════════════════
// Re-point a live WaveSurfer instance at a freshly rendered DOM container.
// Called when the card is re-rendered but WS is already running.
function reattachWS(t,container){
  if(!t.ws) return;
  if(!container) return;
  // WaveSurfer v7: move the internal shadow DOM into the new container
  try{
    const wsEl=t.ws.getMediaElement?.()?.closest?.('.wavesurfer-wrapper')
      || t.ws.getMediaElement?.()?.parentElement?.parentElement;
    if(wsEl && wsEl.parentElement!==container){
      container.innerHTML='';
      container.appendChild(wsEl);
    }
  }catch(e){}
}

function initWS(t){
  // Never destroy a running WS — caller should check t.ws before calling
  if(t.ws){ t.ws.destroy(); t.ws=null; t.region=null; t._rp=null; }
  const waveEl=document.getElementById(`wave-${t.id}`); if(!waveEl) return;
  let rp; try{rp=WaveSurfer.RegionsPlugin.create();}catch(e){}
  const opts={container:`#wave-${t.id}`,waveColor:'#1c2830',progressColor:t.accent,cursorColor:'rgba(255,255,255,.5)',cursorWidth:1,height:72,barWidth:2,barGap:1,barRadius:2,normalize:true,interact:true};
  if(rp) opts.plugins=[rp];
  const ws=WaveSurfer.create(opts);
  t.ws=ws; t._rp=rp||null;
  if(t.src) ws.load(t.src);
  ws.on('ready',()=>{ ws.setPlaybackRate(t.speed); ws.setVolume(effectiveVol(t)); updateDur(t); if(rp&&t.loopStart!==null&&t.loopEnd!==null) mkRegion(t); });
  ws.on('timeupdate',cur=>{ updatePos(t,cur); if(!seekDragging[t.id]){ const dur=ws.getDuration()||1; const sl=document.getElementById(`sks-${t.id}`); if(sl)sl.value=(cur/dur)*1000; } });
  ws.on('seek',()=>{ const cur=ws.getCurrentTime(),dur=ws.getDuration()||1; const sl=document.getElementById(`sks-${t.id}`); if(sl)sl.value=(cur/dur)*1000; updatePos(t,cur); });
  ws.on('play',()=>{ t.playing=true; patchPlay(t); updateStatus(); startAutoStop(t); });
  ws.on('pause',()=>{ t.playing=false; patchPlay(t); updateStatus(); checkRenderNeeded(t); });
  ws.on('finish',()=>{ t.playing=false; patchPlay(t); updateStatus(); checkRenderNeeded(t); });
  if(rp){
    rp.on('region-updated',r=>{ t.loopStart=r.start; t.loopEnd=r.end; updateLoopUI(t); });
    rp.on('region-created',r=>{ rp.getRegions().forEach(x=>{ if(x.id!==r.id) x.remove(); }); t.region=r; t.loopStart=r.start; t.loopEnd=r.end; updateLoopUI(t); });
  }
}

function checkRenderNeeded(t){
  // Only collapse if the track has no reason to stay expanded
  const activeScene=scenes.find(s=>s.id===activeSceneId);
  const activeIds=activeScene?new Set(activeScene.snapshot.map(s=>s.id)):new Set();
  if(!activeIds.has(t.id)&&!expandedIds.has(t.id)&&!t.playing){
    // Destroy WS before collapsing so it doesn't leak
    if(t.ws){ t.ws.destroy(); t.ws=null; t.region=null; t._rp=null; }
    renderTrackArea();
  }
}

function mkRegion(t){
  const rp=t._rp; if(!rp||!t.ws) return;
  rp.getRegions().forEach(r=>r.remove());
  const dur=t.ws.getDuration();
  t.region=rp.addRegion({start:Math.max(0,t.loopStart),end:Math.min(dur,t.loopEnd),color:'rgba(255,193,7,.15)',drag:true,resize:true});
}

// ═══════════════════════════════════════════
// LOOP TICKER
// ═══════════════════════════════════════════
setInterval(()=>{
  tracks.forEach(t=>{
    if(!t.playing||!t.loopEnabled||t.loopStart===null||t.loopEnd===null||!t.ws) return;
    const cur=t.ws.getCurrentTime();
    if(cur>=t.loopEnd){
      if(t.loopCount>0){ t.loopPlays++; if(t.loopPlays>=t.loopCount){ t.loopPlays=0; t.ws.pause(); return; } }
      t.ws.seekTo(t.loopStart/(t.ws.getDuration()||1));
    }
  });
},80);

function setLoopPt(id,which){
  const t=t_byId(id); if(!t?.ws) return;
  const cur=t.ws.getCurrentTime(),dur=t.ws.getDuration();
  if(!dur){alert('Load audio first.');return;}
  if(which==='start'){t.loopStart=cur;if(t.loopEnd!==null&&t.loopEnd<=t.loopStart)t.loopEnd=null;}
  else{t.loopEnd=cur;if(t.loopStart!==null&&t.loopStart>=t.loopEnd)t.loopStart=null;}
  if(t.loopStart!==null&&t.loopEnd!==null) mkRegion(t);
  updateLoopUI(t);
}
function clearLoop(id){
  const t=t_byId(id); if(!t) return;
  t.loopStart=null;t.loopEnd=null;t.loopPlays=0;
  if(t._rp)t._rp.getRegions().forEach(r=>r.remove());
  t.region=null; updateLoopUI(t);
}
function jumpLoop(id,which){
  const t=t_byId(id); if(!t?.ws) return;
  const dur=t.ws.getDuration()||1;
  if(which==='start'&&t.loopStart!==null) t.ws.seekTo(t.loopStart/dur);
  else if(which==='end'&&t.loopEnd!==null) t.ws.seekTo(Math.max(0,t.loopEnd-2)/dur);
}
function toggleLoop(id,state){
  const t=t_byId(id); if(!t) return;
  t.loopEnabled=state; t.loopPlays=0;
  const el=document.getElementById(`ll-${id}`);
  if(el) el.textContent=state?'ON':'OFF';
  updateStatus();
}
function updateLoopUI(t){
  const ie=document.getElementById(`li-${t.id}`);
  const oe=document.getElementById(`lo-${t.id}`);
  const le=document.getElementById(`ll2-${t.id}`);
  if(ie)ie.textContent=t.loopStart!==null?fmtT(t.loopStart):'--:--';
  if(oe)oe.textContent=t.loopEnd!==null?fmtT(t.loopEnd):'--:--';
  if(le)le.textContent=(t.loopStart!==null&&t.loopEnd!==null)?fmtT(t.loopEnd-t.loopStart):'--:--';
}

// ═══════════════════════════════════════════
// CUE POINTS
// ═══════════════════════════════════════════
function renderCues(t){
  if(!t.cues.length) return '<span class="cue-empty">No cues set</span>';
  return t.cues.map(c=>`<div class="cue-chip"><button class="cue-jump" onclick="jumpCue(${t.id},'${c.id}')"><span class="cue-lbl">${esc(c.label)}</span><span class="cue-t">${fmtT(c.time)}</span></button><button class="cue-rm" onclick="rmCue(${t.id},'${c.id}')">✕</button></div>`).join('');
}
function addCue(id){
  const t=t_byId(id);
  if(!t?.ws||!t.ws.getDuration()){alert('Load audio first.');return;}
  const time=t.ws.getCurrentTime();
  const label=prompt(`Cue name (at ${fmtT(time)}):`,`Cue ${t.cues.length+1}`);
  if(label===null) return;
  t.cues.push({id:'c'+Date.now(),label:label||`Cue ${t.cues.length+1}`,time});
  t.cues.sort((a,b)=>a.time-b.time);
  const el=document.getElementById(`cuelist-${id}`); if(el) el.innerHTML=renderCues(t);
}
function rmCue(tid,cid){ const t=t_byId(tid); if(!t) return; t.cues=t.cues.filter(c=>c.id!==cid); const el=document.getElementById(`cuelist-${tid}`); if(el) el.innerHTML=renderCues(t); }
function jumpCue(tid,cid){ const t=t_byId(tid); if(!t?.ws) return; const c=t.cues.find(c=>c.id===cid); if(c) t.ws.seekTo(c.time/(t.ws.getDuration()||1)); }

// ═══════════════════════════════════════════
// TRACK ACTIONS
// ═══════════════════════════════════════════
function addTrack(name='New Track',cat='AMB'){ tracks.push(mkTrack(name,cat)); renderAll(); }

function deleteTrack(id){
  const t=t_byId(id);
  if(t){ clearAutoStop(t); if(t.ws) t.ws.destroy(); if(t.src) URL.revokeObjectURL(t.src); }
  tracks=tracks.filter(t=>t.id!==id);
  expandedIds.delete(id);
  renderAll();
}

async function togglePlay(id){
  const t=t_byId(id); if(!t) return;
  if(!t.src){ alert('Upload an audio file first.'); return; }
  // If not yet expanded, expand and wait for WS to be ready
  if(!t.ws){
    expandedIds.add(id);
    renderTrackArea();
    // wait for WS to initialise (initWS is called synchronously in renderTrackArea)
    await new Promise(resolve=>{
      const check=()=>{ if(t.ws) resolve(); else setTimeout(check,50); };
      check();
    });
    // further wait for audio to be ready if src is loading
    if(t.src && !t.ws.getDuration()){
      await new Promise(resolve=>{ t.ws.once('ready',resolve); setTimeout(resolve,3000); });
    }
  }
  if(t.ws) await t.ws.playPause();
}

function stopTrack(id){
  const t=t_byId(id); if(!t) return;
  clearAutoStop(t); clearInterval(t.fadeTimer);
  if(t.ws) t.ws.stop();
  t.playing=false; t.loopPlays=0;
  patchPlay(t); updateStatus();
  syncVolUI(t);
}

// ═══════════════════════════════════════════
// FADE ALL
// ═══════════════════════════════════════════
let stopAllTimer=null;
function resetStopBtn(){
  const btn=document.getElementById('stopall-btn');
  const lbl=document.getElementById('stopall-lbl');
  const prog=document.getElementById('stopall-progress');
  if(btn) btn.classList.remove('fading');
  if(lbl) lbl.textContent='↓ FADE ALL';
  if(prog){prog.style.transition='none';prog.style.width='0';}
}
function hardStopAll(){
  if(stopAllTimer!==null){clearInterval(stopAllTimer);stopAllTimer=null;}
  tracks.forEach(t=>{clearAutoStop(t);if(t.ws){t.ws.stop();t.ws.setVolume(effectiveVol(t));}t.playing=false;patchPlay(t);});
  updateStatus(); resetStopBtn();
}
function stopAllFade(){
  if(stopAllTimer!==null){hardStopAll();return;}
  const FADE=2000;
  const playing=tracks.filter(t=>t.playing&&t.ws);
  if(!playing.length) return;
  const startVols={}; playing.forEach(t=>{startVols[t.id]=t.ws.getVolume();});
  const btn=document.getElementById('stopall-btn');
  const lbl=document.getElementById('stopall-lbl');
  const prog=document.getElementById('stopall-progress');
  if(btn) btn.classList.add('fading');
  if(lbl) lbl.textContent='■ HARD STOP';
  if(prog){prog.style.transition='none';prog.style.width='0';requestAnimationFrame(()=>{prog.style.transition=`width ${FADE}ms linear`;prog.style.width='100%';});}
  const t0=Date.now();
  stopAllTimer=setInterval(()=>{
    const r=Math.min((Date.now()-t0)/FADE,1);
    playing.forEach(t=>{if(t.ws)t.ws.setVolume(startVols[t.id]*(1-r));});
    if(r>=1){
      clearInterval(stopAllTimer);stopAllTimer=null;
      playing.forEach(t=>{clearAutoStop(t);if(t.ws){t.ws.pause();t.ws.setVolume(effectiveVol(t));}t.playing=false;patchPlay(t);});
      updateStatus();resetStopBtn();
    }
  },30);
}

// ═══════════════════════════════════════════
// VOLUME / FADE / SEEK / SPEED
// ═══════════════════════════════════════════
function onVol(id,v){
  const t=t_byId(id); if(!t) return;
  t.volume=parseFloat(v);
  if(t.ws) t.ws.setVolume(effectiveVol(t));
  // update both expanded and collapsed displays
  const ev=document.getElementById(`vv-${id}`); if(ev) ev.textContent=Math.round(t.volume*100)+'%';
  const tv=document.getElementById(`tvv-${id}`); if(tv) tv.textContent=Math.round(t.volume*100)+'%';
}
function syncVolUI(t){
  const sl=document.getElementById(`vs-${t.id}`); if(sl) sl.value=t.volume;
  const ev=document.getElementById(`vv-${t.id}`); if(ev) ev.textContent=Math.round(t.volume*100)+'%';
  const tv=document.getElementById(`tvv-${t.id}`); if(tv) tv.textContent=Math.round(t.volume*100)+'%';
}

// FIXED FADE: fade in = from current up to set volume (or 100% if set is 0)
//             fade out = from current down to 0
function doFade(id,dir){
  const t=t_byId(id); if(!t?.ws) return;
  clearInterval(t.fadeTimer);
  if(dir==='in'){
    // target = current slider value; if it's 0, use 1
    let target=t.volume<=0.01?1:t.volume;
    // if we're already at or above target, just ensure we're playing
    const start=t.ws.getVolume();
    if(start>=target){ t.volume=target; t.ws.setVolume(effectiveVol(t)); syncVolUI(t); return; }
    t.fadeTimer=setInterval(()=>{
      let v=t.volume; v=Math.min(target,v+0.025); t.volume=v; t.ws.setVolume(effectiveVol(t)); syncVolUI(t);
      if(v>=target) clearInterval(t.fadeTimer);
    },50);
  } else {
    t.fadeTimer=setInterval(()=>{
      let v=t.volume; v=Math.max(0,v-0.025); t.volume=v; t.ws.setVolume(effectiveVol(t)); syncVolUI(t);
      if(v<=0) clearInterval(t.fadeTimer);
    },50);
  }
}
function killVol(id){ const t=t_byId(id); if(!t?.ws) return; clearInterval(t.fadeTimer); t.volume=0; t.ws.setVolume(0); syncVolUI(t); }
function onSeek(id,val){ const t=t_byId(id); if(!t?.ws) return; t.ws.seekTo(val/1000); }
function setSpeed(id,val,sliderEl){
  const t=t_byId(id); if(!t) return; t.speed=parseFloat(val);
  if(t.ws) t.ws.setPlaybackRate(t.speed);
  const sv=document.getElementById(`sv-${id}`); if(sv) sv.textContent=t.speed.toFixed(2)+'x';
  const sl=document.getElementById(`sl-${id}`); if(sl) sl.textContent=t.speed.toFixed(2)+'x';
  if(!sliderEl){ const s=document.querySelector(`#sp-${id} input[type=range]`); if(s) s.value=t.speed; }
}
function toggleSpeedPop(id){
  const el=document.getElementById(`sw-${id}`); if(!el) return;
  const was=el.classList.contains('open');
  document.querySelectorAll('.speed-wrap.open').forEach(e=>e.classList.remove('open'));
  if(!was) el.classList.add('open');
}

// ═══════════════════════════════════════════
// AUTO-STOP
// ═══════════════════════════════════════════
function startAutoStop(t){ clearAutoStop(t); if(t.autoStop>0) t.autoStopTimer=setTimeout(()=>{if(t.ws)t.ws.pause();},t.autoStop*1000); }
function clearAutoStop(t){ if(t.autoStopTimer){clearTimeout(t.autoStopTimer);t.autoStopTimer=null;} }

// ═══════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════
function patchPlay(t){
  const card=document.getElementById(`card-${t.id}`);
  if(card){ card.className='track-card'+(t.playing?' is-playing':''); }
  const pbtn=document.getElementById(`pbtn-${t.id}`);
  if(pbtn){ pbtn.className='btn-play'+(t.playing?' is-playing':''); pbtn.textContent=t.playing?'⏸  PAUSE':'▶  PLAY'; }
  const tcol=document.getElementById(`collapsed-${t.id}`);
  if(tcol){ tcol.className='track-collapsed'+(t.playing?' is-playing':''); tcol.style.setProperty('--accent',t.accent); }
  const tcbtn=document.getElementById(`tcbtn-${t.id}`);
  if(tcbtn){ tcbtn.className='tc-play'+(t.playing?' on':''); tcbtn.textContent=t.playing?'⏸':'▶'; }
}
function updatePos(t,cur){ const el=document.getElementById(`tcur-${t.id}`); if(el) el.textContent=fmtT(cur); }
function updateDur(t){ const dur=t.ws?.getDuration?.()||0; const el=document.getElementById(`tdur-${t.id}`); if(el) el.textContent=dur?fmtT(dur):'--:--'; }
function updateStatus(){
  const playing=tracks.filter(t=>t.playing).length;
  const dot=document.getElementById('live-dot');
  if(dot) dot.className='live-dot'+(playing>0?' on':'');
  const st=document.getElementById('st-playing'); if(st) st.textContent=playing+' PLAYING';
  const tr=document.getElementById('st-tracks'); if(tr) tr.textContent=tracks.length;
  const li=document.getElementById('st-loop'); if(li) li.style.display=tracks.some(t=>t.loopEnabled)?'flex':'none';
  autoSave();
}

// ═══════════════════════════════════════════
// RENAME
// ═══════════════════════════════════════════
function renameStart(id){
  const t=t_byId(id); const el=document.getElementById(`name-${id}`); if(!el||!t) return;
  const orig=t.name; const inp=document.createElement('input'); inp.className='card-name-input'; inp.value=t.name;
  el.replaceWith(inp); inp.focus(); inp.select();
  const commit=()=>{ t.name=inp.value.trim()||orig; const d=document.createElement('div'); d.className='card-name'; d.id=`name-${id}`; d.title='Double-click to rename'; d.textContent=t.name; d.ondblclick=()=>renameStart(id); inp.replaceWith(d); };
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter')inp.blur(); if(e.key==='Escape'){inp.value=orig;inp.blur();} });
}

// ═══════════════════════════════════════════
// SCENES
// ═══════════════════════════════════════════
function mkSnapshot(){
  return tracks.map(t=>({id:t.id,name:t.name,cat:t.cat,volume:t.volume,speed:t.speed,playing:t.playing,loopEnabled:t.loopEnabled,loopStart:t.loopStart,loopEnd:t.loopEnd,loopCount:t.loopCount,cues:JSON.parse(JSON.stringify(t.cues))}));
}

function saveScene(){
  const name=prompt('Scene name:',`Scene ${scenes.length+1}`); if(!name) return;
  scenes.push({id:'s'+Date.now(),name,notes:'',snapshot:mkSnapshot(),fadeDur:2});
  renderScenes(); autoSave();
}

function fireScene(sid,xfade=false){
  const s=scenes.find(s=>s.id===sid); if(!s) return;
  activeSceneId=sid;
  const fadeDur=(xfade?Math.max(0.5,s.fadeDur):0)*1000;
  const snapMap={}; s.snapshot.forEach(sn=>{ snapMap[sn.id]=sn; });

  tracks.forEach(t=>{
    clearInterval(t.fadeTimer);
    const snap=snapMap[t.id];
    if(!snap){
      if(t.playing&&t.ws){
        if(xfade&&fadeDur>0){
          const sv=t.ws.getVolume(),t0=Date.now();
          t.fadeTimer=setInterval(()=>{ const r=Math.min((Date.now()-t0)/fadeDur,1); t.ws?.setVolume(sv*(1-r)); if(r>=1){clearInterval(t.fadeTimer);t.ws?.pause();t.playing=false;t.ws?.setVolume(effectiveVol(t));patchPlay(t);updateStatus();} },30);
        } else { t.ws.pause(); t.playing=false; patchPlay(t); updateStatus(); }
      }
      return;
    }
    const wasPlaying=t.playing, willPlay=snap.playing;
    if(!xfade||fadeDur<=0){ applySnap(t,snap); return; }
    if(wasPlaying&&willPlay){
      applySnapMeta(t,snap);
      const sv=t.volume,tv=snap.volume,t0=Date.now();
      t.fadeTimer=setInterval(()=>{ const r=Math.min((Date.now()-t0)/fadeDur,1); const ease=r<.5?2*r*r:(4-2*r)*r-1; t.volume=sv+(tv-sv)*ease; t.ws?.setVolume(effectiveVol(t)); syncVolUI(t); if(r>=1){clearInterval(t.fadeTimer);t.volume=tv;t.ws?.setVolume(effectiveVol(t));syncVolUI(t);} },30);
    } else if(wasPlaying&&!willPlay){
      const sv=t.ws?.getVolume()??t.volume,t0=Date.now();
      t.fadeTimer=setInterval(()=>{ const r=Math.min((Date.now()-t0)/fadeDur,1); t.ws?.setVolume(sv*(1-r)); if(r>=1){clearInterval(t.fadeTimer);t.ws?.pause();t.playing=false;t.volume=snap.volume;t.ws?.setVolume(effectiveVol(t));syncVolUI(t);patchPlay(t);updateStatus();applySnapMeta(t,snap);} },30);
    } else if(!wasPlaying&&willPlay){
      applySnapMeta(t,snap);
      if(t.ws){ seekToStart(t,snap); t.ws.setVolume(0); t.ws.play().then(()=>{ const tv=snap.volume,t0=Date.now(); t.fadeTimer=setInterval(()=>{ const r=Math.min((Date.now()-t0)/fadeDur,1); t.volume=tv*r; t.ws?.setVolume(effectiveVol(t)); syncVolUI(t); if(r>=1){clearInterval(t.fadeTimer);t.volume=tv;syncVolUI(t);} },30); }).catch(()=>{}); }
      else { expandTrack(t.id); setTimeout(()=>{ const tk=t_byId(t.id); if(tk?.ws){ seekToStart(tk,snap); tk.ws.play(); } },300); }
    }
  });

  // single re-render after all track transitions are set up
  renderTrackArea();
  renderScenes();
  updateNotesBanner();
  autoSave();
}

function seekToStart(t,snap){
  if(!t.ws) return;
  const dur=t.ws.getDuration()||1;
  const ls=snap.loopStart??t.loopStart;
  if(snap.loopEnabled&&ls!==null) t.ws.seekTo(ls/dur); else t.ws.seekTo(0);
}
function applySnap(t,snap){
  t.volume=snap.volume; t.speed=snap.speed; t.loopEnabled=snap.loopEnabled;
  t.loopStart=snap.loopStart; t.loopEnd=snap.loopEnd; t.loopCount=snap.loopCount; t.loopPlays=0;
  if(t.ws){ t.ws.setVolume(effectiveVol(t)); t.ws.setPlaybackRate(t.speed); }
  syncVolUI(t);
  if(snap.playing&&!t.playing&&t.ws){ seekToStart(t,snap); t.ws.play(); }
  if(!snap.playing&&t.playing&&t.ws) t.ws.pause();
}
function applySnapMeta(t,snap){
  t.speed=snap.speed; t.loopEnabled=snap.loopEnabled;
  t.loopStart=snap.loopStart; t.loopEnd=snap.loopEnd; t.loopCount=snap.loopCount; t.loopPlays=0;
  if(t.ws) t.ws.setPlaybackRate(t.speed);
}

function onSceneNotes(sid,val){
  const s=scenes.find(s=>s.id===sid); if(!s) return;
  s.notes=val;
  // if this is the active scene, update the banner live
  if(activeSceneId===sid) updateNotesBanner();
  autoSave();
}

function updateSceneInPlace(sid){
  const s=scenes.find(s=>s.id===sid); if(!s) return;
  s.snapshot=mkSnapshot();
  const card=document.getElementById(`scard-${sid}`);
  if(card){
    const prev=card.querySelector('.scene-item-preview');
    if(prev) prev.innerHTML=buildPreviewHTML(s);
    const ubtn=card.querySelector('.scene-btn.update');
    if(ubtn){ ubtn.textContent='✓ SAVED'; ubtn.style.color='var(--green)'; setTimeout(()=>{ ubtn.textContent='↑ UPDATE'; ubtn.style.color=''; },1400); }
  }
  autoSave();
}

function deleteScene(sid){
  scenes=scenes.filter(s=>s.id!==sid);
  if(activeSceneId===sid) activeSceneId=null;
  renderScenes(); autoSave();
}

function renameScene(sid){
  const s=scenes.find(s=>s.id===sid); const el=document.getElementById(`sname-${sid}`); if(!el||!s) return;
  const orig=s.name; const inp=document.createElement('input'); inp.className='scene-name-input'; inp.value=s.name;
  el.replaceWith(inp); inp.focus(); inp.select();
  const commit=()=>{ s.name=inp.value.trim()||orig; const d=document.createElement('div'); d.className='scene-item-name'; d.id=`sname-${sid}`; d.ondblclick=()=>renameScene(sid); d.textContent=s.name; inp.replaceWith(d); if(activeSceneId===sid) d.style.color='var(--green)'; autoSave(); };
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter')inp.blur(); if(e.key==='Escape'){inp.value=orig;inp.blur();} });
}

function buildPreviewHTML(s){
  return s.snapshot.slice(0,3).map(sn=>`<div class="scene-preview-row"><div class="spd${sn.playing?' on':''}"></div><span class="spn">${esc(sn.name)}</span><span class="spv">${Math.round(sn.volume*100)}%${sn.loopEnabled?' ⟳':''}</span></div>`).join('')+(s.snapshot.length>3?`<div style="font-size:8px;color:var(--muted);margin-top:1px">+${s.snapshot.length-3} more</div>`:'');
}

function updateNotesBanner(){
  const s=scenes.find(s=>s.id===activeSceneId);
  const banner=document.getElementById('notes-banner');
  const text=document.getElementById('notes-banner-text');
  if(!banner||!text) return;
  if(s&&s.notes&&s.notes.trim()){
    text.textContent=s.notes.trim();
    banner.classList.add('visible');
  } else {
    banner.classList.remove('visible');
  }
}

function renderScenes(){
  const list=document.getElementById('scene-list');
  const cnt=document.getElementById('scene-count');
  if(cnt) cnt.textContent=scenes.length;
  if(!scenes.length){ list.innerHTML='<div style="font-size:9px;color:var(--muted);padding:12px;text-align:center;font-style:italic">No scenes yet</div>'; updateNotesBanner(); return; }
  list.innerHTML=scenes.map(s=>`
    <div class="scene-item${activeSceneId===s.id?' active':''}" id="scard-${s.id}">
      <div class="scene-item-header" ondblclick="renameScene('${s.id}')">
        <div class="scene-active-dot"></div>
        <div class="scene-item-name" id="sname-${s.id}" title="Double-click to rename">${esc(s.name)}</div>
        <div class="scene-item-actions">
          <button class="scene-icon-btn del" onclick="deleteScene('${s.id}')" title="Delete">✕</button>
        </div>
      </div>
      <div class="scene-item-preview">${buildPreviewHTML(s)}</div>
      <div class="scene-notes-wrap">
        <textarea class="scene-notes" rows="2" placeholder="Add notes for this scene…"
          oninput="onSceneNotes('${s.id}',this.value)"></textarea>
      </div>
      <div class="scene-fade-row">XFADE <input type="number" min=".5" max="30" step=".5" value="${s.fadeDur}" oninput="scenes.find(s=>s.id==='${s.id}').fadeDur=parseFloat(this.value)||2"> SEC</div>
      <div class="scene-item-footer">
        <button class="scene-btn fire" onclick="fireScene('${s.id}',false)">▶ FIRE</button>
        <button class="scene-btn xfade" onclick="fireScene('${s.id}',true)">⇄ XFADE</button>
        <button class="scene-btn update" onclick="updateSceneInPlace('${s.id}')" style="${activeSceneId===s.id?'color:var(--amber)':''}">↑ UPDATE</button>
      </div>
    </div>`).join('');
  // Restore textarea values after innerHTML rebuild (raw text, not HTML-escaped)
  scenes.forEach(s=>{
    const ta=document.querySelector(`#scard-${s.id} .scene-notes`);
    if(ta) ta.value=s.notes||'';
  });
  updateNotesBanner();
}

// ═══════════════════════════════════════════
// PERSIST — localStorage + JSON export/import
// ═══════════════════════════════════════════
function stateToJSON(){
  return JSON.stringify({
    version:6,
    tracks:tracks.map(t=>({id:t.id,name:t.name,cat:t.cat,volume:t.volume,speed:t.speed,loopEnabled:t.loopEnabled,loopStart:t.loopStart,loopEnd:t.loopEnd,loopCount:t.loopCount,accent:t.accent,order:t.order,cues:t.cues,autoStop:t.autoStop,filename:t.filename})),
    scenes,activeSceneId,masterVol,uid
  });
}

let _autoSaveTimer=null;
function autoSave(){
  clearTimeout(_autoSaveTimer);
  _autoSaveTimer=setTimeout(()=>{
    try{ localStorage.setItem('offside_v6',stateToJSON()); }catch(e){}
  },800);
}

function exportState(){
  const blob=new Blob([stateToJSON()],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='offside-sound-session.json'; a.click();
  showToast('Session exported!');
}

function deserializeTracks(dataArr){
  return dataArr.map(td=>{
    const t=mkTrack(td.name, td.cat||'AMB');
    Object.assign(t,{
      id:td.id, name:td.name, cat:td.cat||'AMB',
      volume:td.volume??1, speed:td.speed||1,
      loopEnabled:td.loopEnabled||false,
      loopStart:td.loopStart??null, loopEnd:td.loopEnd??null,
      loopCount:td.loopCount||0, accent:td.accent||t.accent,
      order:td.order||t.order, cues:td.cues||[],
      autoStop:td.autoStop||0, filename:td.filename||null,
      src:null, ws:null, _rp:null, region:null,
      playing:false, fadeTimer:null, autoStopTimer:null, loopPlays:0,
    });
    return t;
  });
}

function importState(event){
  const f=event.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.tracks) throw new Error('Invalid file');
      tracks.forEach(t=>{ if(t.ws) t.ws.destroy(); });
      tracks=[]; scenes=[]; expandedIds.clear();
      uid=data.uid||0; masterVol=data.masterVol||1; activeSceneId=data.activeSceneId||null;
      tracks=deserializeTracks(data.tracks);
      scenes=(data.scenes||[]).map(s=>({notes:'', ...s}));
      const ms=document.getElementById('master-val'); if(ms) ms.textContent=Math.round(masterVol*100)+'%';
      const msl=document.querySelector('.master-row input[type=range]'); if(msl) msl.value=masterVol;
      renderAll();
      showToast('Session imported! Re-upload audio files to restore playback.');
    } catch(err){ alert('Could not import: '+err.message); }
  };
  reader.readAsText(f);
  event.target.value='';
}

function loadAutoSave(){
  try{
    const raw=localStorage.getItem('offside_v6'); if(!raw) return false;
    const data=JSON.parse(raw);
    if(!data.tracks||!data.tracks.length) return false;
    uid=data.uid||0; masterVol=data.masterVol||1; activeSceneId=data.activeSceneId||null;
    tracks=deserializeTracks(data.tracks);
    scenes=(data.scenes||[]).map(s=>({notes:'',...s}));
    const mSlider=document.querySelector('.master-row input[type=range]'); if(mSlider) mSlider.value=masterVol;
    const mVal=document.getElementById('master-val'); if(mVal) mVal.textContent=Math.round(masterVol*100)+'%';
    return true;
  }catch(e){ return false; }
}

// ═══════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  const n=parseInt(e.key);
  if(!isNaN(n)&&n>=1&&n<=9){ const t=tracks[n-1]; if(t) togglePlay(t.id); return; }
  if(e.key==='s'||e.key==='S') stopAllFade();
  if(e.key==='Escape') hardStopAll();
});
document.addEventListener('click',e=>{
  if(!e.target.closest('[id^="cbw-"]')) document.querySelectorAll('.cat-popup.open').forEach(p=>p.classList.remove('open'));
  if(!e.target.closest('.speed-wrap')) document.querySelectorAll('.speed-wrap.open').forEach(s=>s.classList.remove('open'));
});

// ═══════════════════════════════════════════
// UTIL
// ═══════════════════════════════════════════
function fmtT(s){ if(s===null||s===undefined) return '--:--'; const m=Math.floor(s/60),sec=Math.floor(s%60).toString().padStart(2,'0'),ds=Math.floor((s%1)*10); return `${m}:${sec}.${ds}`; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
const restored=loadAutoSave();
if(restored){
  renderAll();
  showToast('Session restored from last save');
} else {
  addTrack('Rain Ambience','AMB');
  addTrack('Tension Drone','BGM');
  addTrack('Church Bell','SFX');
}
</script>
